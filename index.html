<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZUMEN TASK">
<meta name="theme-color" content="#f5f4f0">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231c1c1a'/%3E%3Cpath d='M40 52h100M40 90h100M40 128h64' stroke='%23fff' stroke-width='12' stroke-linecap='round'/%3E%3Cpath d='M118 112l22 22' stroke='%23d2462b' stroke-width='14' stroke-linecap='round'/%3E%3C/svg%3E">
<title>ZUMEN TASK — 図面リスト型タスク管理</title>
<style>
:root{
  --bg:#f5f4f0; --paper:#fff; --ink:#1c1c1a; --sub:#6b6a66; --mute:#a8a6a0;
  --line:#dedbd3; --line2:#ebe8e1; --accent:#d2462b; --accent-s:#fbe9e4;
  --inst:#2457c5; --inst-s:#e6edfb; --ok:#2f8f5b; --warn:#c98a12;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--mute)}

/* header */
#top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:5}
.logo{font-family:var(--mono);font-weight:700;letter-spacing:.12em;font-size:14px;white-space:nowrap}
.logo b{color:var(--accent)}
#projSel{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;max-width:240px}
.tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:5px;color:var(--sub);white-space:nowrap}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.sp{flex:1}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 10px;white-space:nowrap}
.tbtn:hover{border-color:var(--ink)}
.tbtn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbtn:disabled{opacity:.4;cursor:default}
#sync{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
#sync.ok i{background:var(--ok)} #sync.pending i{background:var(--warn)} #sync.sync i{background:var(--inst);animation:pulse 1s infinite} #sync.err i{background:var(--accent)}
@keyframes pulse{50%{opacity:.3}}
#app{height:calc(100vh - 52px);overflow:hidden}

/* list view */
.lv{height:100%;overflow:auto;padding:24px 36px 80px}
.lvbar{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.lvbar h2{margin:0;font-size:20px;font-weight:600}
.lvbar .stat{font-family:var(--mono);color:var(--sub);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;color:var(--sub)}
.seg button.on{background:var(--ink);color:#fff}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);cursor:pointer}
.mscards{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:stretch}
.mscard{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:10px 12px;width:260px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mscard:hover{border-color:#b9b5ab;border-top-color:var(--c)}
.mscard .n{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mscard .pd{font-size:10.5px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:3px;padding:1px 5px;align-self:flex-start;max-width:100%}
.msstart{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#faf9f6;border-radius:6px;margin-bottom:6px;flex-wrap:wrap}
.msstart input,.msrow input[type=text],.msrow input[type=date]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
.lbl{font-size:11px;color:var(--sub);white-space:nowrap}
.msrow{border-left:3px solid var(--line);margin:0 0 0 14px;padding:4px 0 4px 14px}
.msrow .per{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.msrow .per input{flex:1;max-width:340px;background:#fffef6!important}
.msrow .msl2{display:grid;grid-template-columns:36px 54px 1fr 150px 28px;gap:8px;align-items:center;margin-left:-30px;background:#fff;padding:4px 0}
.msrow .msl2 input[type=color]{width:36px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}
.mtabw{overflow-x:auto;max-width:1150px;margin-bottom:4px}
.mtab{border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:12px}
.mtab th{font-size:10.5px;color:var(--sub);font-weight:500;padding:5px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;line-height:1.3}
.mtab th b{font-size:12.5px;color:var(--ink)} .mtab th small{display:block;font-size:9.5px;color:var(--mute)}
.mtab th.l,.mtab td.l{text-align:left;padding-left:12px;white-space:nowrap}
.mtab td{padding:4px 4px;border-bottom:1px solid var(--line2);text-align:center}
.mtab th.cur,.mtab td.cur{background:#f3f7fd}
.mtab input{width:58px;border:1px dashed var(--line);border-radius:4px;padding:3px 4px;font-family:var(--mono);font-size:12px;text-align:right;background:#fff}
.mtab input[data-mstd]{border-style:solid;width:62px}
.mtab input.man{border:1px solid var(--warn);background:#fdf3dc}
.mscard .d{font-family:var(--mono);font-size:11px;color:var(--sub)}
.mscard .big{font-family:var(--mono);font-size:20px;font-weight:600;margin:2px 0}
.mscard .big small{font-size:11px;color:var(--sub);font-weight:400;margin-left:6px}
.judge{font-size:11.5px;display:flex;align-items:center;gap:5px}
.judge i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.j-ok i{background:var(--ok)} .j-warn i{background:var(--warn)} .j-over i{background:var(--accent)} .j-done i{background:var(--mute)}
.j-over{color:var(--accent)} .j-warn{color:#8a5d00}
.msadd{border:1px dashed var(--line);background:none;border-radius:8px;width:120px;color:var(--sub);font-size:12px}
.msadd:hover{color:var(--ink);border-color:var(--ink)}
.dlist{position:relative;width:922px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.drow,.crow{display:grid;grid-template-columns:22px 20px 96px 1fr 56px 120px 220px 26px 22px 28px;align-items:center;height:40px;border-bottom:1px solid var(--line2);position:relative}
.drow:last-of-type{border-bottom:0}
.drow.head{height:34px;font-size:11px;color:var(--sub);letter-spacing:.06em;background:#faf9f6;border-radius:8px 8px 0 0;border-bottom:1px solid var(--line)}
.drow.head div{padding:0 8px}
.drow:not(.head):hover{background:#fbfaf7}
.drow.hl{background:var(--accent-s)!important}
.drow.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.drow.flash{animation:flash 1.4s}
.caret{border:0;background:none;color:var(--sub);font-size:10px;width:20px;height:24px;padding:0;border-radius:4px;justify-self:end}
.caret:hover{background:var(--line2);color:var(--ink)}
.caret.none{visibility:hidden}
.crow{height:30px;background:#fbfaf7;border-bottom:1px solid var(--line2);font-size:12px}
.crow .cn{grid-column:4;padding-left:20px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:baseline}
.crow .cn>span{cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.crow .cn em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-left:auto;padding-right:6px}
.crow .csc{grid-column:6;font-family:var(--mono);font-size:11.5px;padding:2px 6px;height:24px}
.cell.ro{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chead .csc{flex:none;width:76px;font-family:var(--mono);font-size:12px;font-weight:400}
.crow .cn::before{content:"└ ";color:var(--line)}
.crow .cn>span:hover{color:var(--ink);text-decoration:underline}
.crow .cm{grid-column:6;font-family:var(--mono);font-size:10.5px;color:var(--mute);padding:0 8px;white-space:nowrap}
.crow .prog{grid-column:7;cursor:pointer}
.crow .sbar{height:5px}
.crow .ico{grid-column:8}
.tbtn.sm{padding:3px 8px;font-size:11.5px}
/* 枚数管理 */
.dvbar.sub{margin:-2px 0 8px 6px;font-size:12px}
.dvbar.sub .subl{color:var(--mute);font-size:11.5px}
.dvbar.sub .dvseg button{font-size:11.5px;padding:3px 10px}
.dvbar.sub .subh{color:var(--sub);font-size:11.5px}
.addcrow{display:block;padding:0 0 0 160px;background:#fbfaf7}
.addcin{width:340px;border:none;background:none;font-size:12px;height:28px;color:var(--ink);outline:none}
.addcin::placeholder{color:var(--mute)} .addcin:focus{background:#fff;box-shadow:inset 0 -1px 0 var(--ink)}
.cins{position:absolute;left:186px;bottom:-9px;z-index:5;width:18px;height:18px;border-radius:50%;border:1px solid var(--ink);background:#fff;color:var(--ink);font-size:13px;line-height:15px;padding:0;cursor:pointer;opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s;pointer-events:none}
.cins::after{content:"";position:absolute;left:18px;top:8px;width:520px;border-top:1.5px solid var(--ink);opacity:0;transition:opacity .12s;pointer-events:none}
.drow:hover .cins,.crow:hover .cins{opacity:.35;transform:scale(.8);pointer-events:auto}
.cins:hover{opacity:1!important;transform:scale(1)!important;background:var(--ink);color:#fff}
.cins:hover::after{opacity:.6}
.crow .cdel{grid-column:9;opacity:0} .crow:hover .cdel{opacity:.6} .crow .cdel:hover{opacity:1}
.chead .cdel{opacity:.35} .chead .cdel:hover{opacity:1}
.srow .cn{display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap}
.srow .spg{font-family:var(--mono);font-size:10.5px;color:#fff;background:var(--sub);border-radius:3px;padding:0 5px;margin-right:4px;flex:none;min-width:14px;text-align:center}
.srow .scn{cursor:pointer;overflow:hidden;text-overflow:ellipsis} .srow .scn:hover{text-decoration:underline}
.srow .splus{color:var(--mute)} .srow .ssame{font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 4px;flex:none}
.srow .sapp{grid-column:5;justify-self:center}
.srow .snw{grid-column:6;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.srow .sn{width:48px;text-align:right;font-family:var(--mono);border:1px solid var(--line);border-radius:4px;background:#fff;padding:1px 4px}
.srow .prog{grid-column:7}
.srow .sact{grid-column:8 / span 2;display:flex;gap:2px}
.srow.app .scn{font-weight:700;color:var(--ink)}
.snum b{font-family:var(--mono)}
/* 図面フローチャート */
.dvbar{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.dvseg button{font-size:12px;padding:4px 12px}
.flowwrap{max-width:100%}
.flow{position:relative;margin:4px 0 10px;overflow:visible}
.flow>svg{position:absolute;left:0;top:0;pointer-events:none}
.flow>svg .fe path{pointer-events:stroke}
.flow>svg path.sol{stroke:#5c5a55;stroke-width:1.6}
.flow>svg path.tsk{stroke:#9a978f;stroke-width:1.2;stroke-dasharray:4 3}
.flow .fl{font-size:10.5px;fill:#d2462b;paint-order:stroke;stroke:#faf9f6;stroke-width:4px}
.flow .fltx{font-size:9.5px;fill:#9a978f;paint-order:stroke;stroke:#faf9f6;stroke-width:4px}
.fcol{position:absolute;top:6px;font-size:10.5px;color:var(--mute);letter-spacing:.05em;border-bottom:1px solid var(--line2);padding-bottom:3px}
.fnode{position:absolute;width:214px;height:74px;box-sizing:border-box;background:var(--paper);border:1px solid var(--line);border-left:5px solid color-mix(in srgb,var(--ink) calc(var(--w) * .9),#d9d6ce);border-radius:7px;padding:6px 9px 0;cursor:pointer;transition:opacity .12s,box-shadow .12s;overflow:hidden}
.fnode:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.fnode.top{box-shadow:0 0 0 2px var(--ink)}
.fn1{display:flex;gap:5px;align-items:center;font-size:11px;height:16px}
.fn1 .no{font-family:var(--mono);color:var(--sub)} .fn1 .appb{margin-left:0}
.frk{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:11px;background:var(--ink);color:#fff;border-radius:3px;padding:0 4px}
.fn2{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.fn3{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)} .fn3 b{color:var(--ink);font-size:12.5px}
.fnbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line2)} .fnbar i{display:block;height:100%;background:#2e9e6a}
.flow.hov .fnode:not(.on):not(.dn):not(.upn){opacity:.3}
.flow.hov .fe{opacity:.15} .flow.hov .fe.dn,.flow.hov .fe.upn{opacity:1}
.flow.hov .fe.dn path.sol,.flow.hov .fe.dn path.tsk{stroke:#d2462b;stroke-width:2}
.flow.hov .fe.upn path.sol,.flow.hov .fe.upn path.tsk{stroke:#2c6fd1;stroke-width:2}
.fnode.dn{border-color:#d2462b} .fnode.upn{border-color:#2c6fd1}
.falone{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 10px} .falone .fnode{position:relative}
/* 確認申請 */
.appck{justify-self:center;border:1px dashed #cfccc4;background:none;color:transparent;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 4px;border-radius:3px;cursor:pointer;line-height:1.4;min-width:34px}
.appck::before{content:"申請"}
.drow:hover .appck{color:#c9c6be}
.appck.on{border:1.5px solid var(--ink);color:var(--ink);background:#fff}
.appck.part{border:1.5px solid var(--ink);color:var(--ink);background:#fff;border-style:solid}
.appck small,.appb small{font-weight:400;font-size:.82em;margin-left:2px;font-family:var(--mono)}
.crow .appck{grid-column:5;padding:0 3px;font-size:10px;min-width:30px}
.crow:hover .appck{color:#c9c6be} .crow .appck.on{color:var(--ink)}
.crow.app .cn>span{color:var(--ink);font-weight:700}
.chead .appck{flex:none;color:#cfccc4} .chead .appck.on{color:var(--ink)}
.drow.app .nm{font-weight:700}
.drow.head .apph{padding:0;text-align:center}
.appb{display:inline-block;border:1.2px solid var(--ink);color:var(--ink);font-size:9.5px;font-weight:700;line-height:1.3;padding:0 3px;border-radius:2px;margin-left:5px;vertical-align:1px;flex:none;background:#fff}
.sitem.app .nm{font-weight:700}
.shead .appb{font-size:10.5px;padding:1px 4px}

/* member view */
.mv{height:100%;overflow:auto;padding:24px 36px 80px}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;margin-bottom:18px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px}
.heat th{font-size:11px;color:var(--sub);font-weight:500;padding:4px 8px;text-align:center;white-space:nowrap}
.heat th.l{text-align:left}
.heat td{padding:6px 10px;border-radius:5px;text-align:center;font-family:var(--mono);min-width:110px;cursor:pointer}
.heat td.l{text-align:left;font-family:var(--sans);background:none;min-width:90px;cursor:default}
.heat td b{display:block;font-size:14px}
.heat td small{font-size:10px;color:var(--sub)}
.h-ok{background:#e3f2e9}.h-warn{background:#fcefcf}.h-over{background:#f9d9d1}.h-none{background:#f3f1ec;color:var(--mute)}
.h-over b{color:var(--accent)}
.mcard{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;margin-bottom:16px;max-width:1150px}
.mcard>header{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.mcard>header h3{margin:0;font-size:15px}
.mcard .capin{width:56px;border:1px solid var(--line);border-radius:4px;padding:2px 5px;font-family:var(--mono);text-align:right}
.mcard .kv{font-size:11.5px;color:var(--sub);font-family:var(--mono)}
.mcard .kv b{color:var(--ink);font-size:13px}
.xproj{font-size:11px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.xproj span{background:var(--bg);border-radius:10px;padding:1px 8px;font-family:var(--mono)}
.xproj .warn{background:var(--accent-s);color:var(--accent)}
.mbars{padding:10px 14px 4px;display:grid;grid-template-columns:200px 1fr 120px;gap:6px 12px;align-items:center;font-size:12px}
.mbars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbars .nm i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.lb{position:relative;height:14px;background:var(--line2);border-radius:3px;overflow:hidden}
.lb>i{position:absolute;top:0;bottom:0;left:0;background:var(--c);opacity:.85}
.lb>em{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.mbars .num{font-family:var(--mono);font-size:11px;text-align:right}
.mbars .num.over{color:var(--accent);font-weight:600}
.mbars .num.warn{color:#8a5d00}
.mtasks{width:100%;border-collapse:collapse;font-size:12.5px}
.mtasks th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line2);background:#faf9f6}
.mtasks td{padding:3px 8px;border-bottom:1px solid var(--line2)}
.mtasks tr.isdone td{color:var(--mute)} .mtasks tr.isdone .ttl{text-decoration:line-through;color:var(--mute)}
.mtasks .pl{font-size:11.5px;color:var(--sub)}
.plc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;line-height:1.5}
.plc a{font-family:var(--mono);font-size:11px;color:var(--ink);cursor:pointer;border-bottom:1px dotted var(--mute)}
.plc b{font-weight:600;color:var(--ink)} .plc span{color:var(--line)}
.plc.sub{opacity:.6;font-size:11px}
.mtasks details{padding:0}
.mtasks .hrs{width:50px}
.wk{display:inline-flex;align-items:center;gap:3px;margin-left:4px;vertical-align:middle}
.wk label{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--sub)}
.wk label.we i{color:var(--accent)}
.wk i{font-style:normal;line-height:1.1}
.wk input{width:36px;border:1px solid var(--line);border-radius:4px;padding:1px 3px;font-family:var(--mono);font-size:11.5px;text-align:right}
.wk b{margin-left:6px;font-family:var(--mono);font-size:12px;color:var(--ink)}
.ovw{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:3px}
.ovin{width:52px;border:1px dashed var(--line);border-radius:4px;padding:1px 4px;font-family:var(--mono);font-size:11.5px;text-align:right;background:#fff}
.ovin.man{border:1px solid var(--warn);background:#fdf3dc}
.mtag{font-size:10px;color:#8a5d00}
.mbhead{font-size:10.5px;color:var(--mute)}
.grip{color:var(--mute);cursor:grab;text-align:center;font-size:13px;letter-spacing:-2px;user-select:none;touch-action:none;padding:8px 0}
.grip:hover{color:var(--ink)}
.drow.dragging{z-index:5;background:#fff!important;box-shadow:0 6px 18px rgba(0,0,0,.15);opacity:.95;transition:none}
.drow.dragafter{box-shadow:inset 0 -2px 0 var(--accent)}
.cell[readonly]{color:var(--sub);cursor:default}
.cell[readonly]:hover{border-color:transparent}
#numMode{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;font-size:12px}
.cell{border:1px solid transparent;background:none;padding:5px 8px;border-radius:4px;width:100%;min-width:0}
.cell:hover{border-color:var(--line)} .cell:focus{border-color:var(--ink);background:#fff;outline:0}
.cell.no,.cell.sc{font-family:var(--mono);font-size:12px}
.prog{display:flex;align-items:center;gap:8px;padding:0 8px;cursor:pointer;min-width:0}
.sbar{display:flex;gap:2px;height:7px;flex:1;min-width:0}
.sbar span{position:relative;border-radius:2px;overflow:hidden;background:#ece9e2;min-width:4px}
.sbar span::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.2}
.sbar span i{position:relative;display:block;height:100%;background:var(--c)}
.pct{font-family:var(--mono);font-size:12px;width:40px;text-align:right;flex:none}
.ico{border:0;background:none;color:var(--mute);border-radius:4px;width:24px;height:24px;line-height:1;padding:0}
.ico:hover{background:var(--line2);color:var(--ink)}
.drow .del{opacity:0} .drow:hover .del{opacity:1}
.port{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mute);background:#fff;padding:0;justify-self:center}
.port:hover,.port.on{border-color:var(--accent);background:var(--accent)}
.linking .port{border-color:var(--accent)}
.addrowbtn{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:none;padding:9px;color:var(--sub);border-radius:0 0 8px 8px}
.addrowbtn:hover{background:#faf9f6;color:var(--ink)}
.linksvg{position:absolute;top:0;left:calc(100% - 14px);overflow:visible;pointer-events:none}
.linksvg .lk{pointer-events:stroke;cursor:pointer}
.linksvg .lbl{pointer-events:all;cursor:pointer}
.linksvg .lk:hover,.linksvg g.hov .lk{stroke:var(--accent)}
.hint{color:var(--sub);font-size:12px;margin-top:14px;line-height:1.8}
.hint kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:#fff;font-size:11px}
.linkbanner{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.legendms{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:8px 0 0}
.legendms span{display:inline-flex;align-items:center;gap:4px}
.legendms i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}

/* detail view */
.dv{display:grid;grid-template-columns:var(--sideW,210px) minmax(380px,1fr) var(--treeW,42%);height:100%;position:relative}
.treeres{position:absolute;top:0;bottom:0;right:calc(var(--treeW,42%) - 4px);width:8px;cursor:col-resize;z-index:4;touch-action:none}
.treeres::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.treeres:hover::after,.treeres.on::after{background:var(--inst)}
.treeres i{position:absolute;top:50%;left:0;width:8px;height:36px;margin-top:-18px;border-radius:4px;background:var(--inst);opacity:0;transition:opacity .15s}
.treeres:hover i,.treeres.on i{opacity:1}
.dv.wide .treeres{display:none}
.dv.wide{grid-template-columns:var(--sideW,180px) minmax(360px,30%) 1fr}
.sideres{position:absolute;top:0;bottom:0;left:calc(var(--sideW,210px) - 4px);width:8px;cursor:col-resize;z-index:4;touch-action:none}
.sideres::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.sideres:hover::after,.sideres.on::after{background:var(--inst)}
.sideres i{position:absolute;top:50%;left:0;width:8px;height:36px;margin-top:-18px;border-radius:4px;background:var(--line);opacity:.0;transition:opacity .15s}
.sideres:hover i,.sideres.on i{opacity:1;background:var(--inst)}
body.resizing{cursor:col-resize!important;user-select:none}
.zoom{display:inline-flex;align-items:center;gap:2px;margin-left:auto}
.zoom button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:2px 7px;font-size:12px}
.zoom span{font-family:var(--mono);font-size:11px;width:40px;text-align:center;color:var(--sub)}
.side{border-right:1px solid var(--line);overflow:auto;background:#faf9f6;padding:10px 0}
.side h4{margin:4px 14px 8px;font-size:11px;color:var(--sub);letter-spacing:.08em;font-weight:500}
.sitem{display:grid;grid-template-columns:auto 1fr auto;gap:4px;align-items:center;padding:7px 14px;cursor:pointer;border-left:3px solid transparent}
.sitem:hover{background:#f1efe9}
.sitem.on{background:var(--paper);border-left-color:var(--ink)}
.sitem.hl{background:var(--inst-s);border-left-color:var(--inst)}
.sitem .no{font-family:var(--mono);font-size:11px;color:var(--sub)}
.sitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sitem .no{min-width:52px}
.sitem .st{color:#e0a100;font-size:10.5px;margin-left:3px}
.sitem .pc{font-family:var(--mono);font-size:11px;text-align:right;color:var(--sub)}
.side .addd{margin:10px 14px;border:1px dashed var(--line);background:none;border-radius:6px;padding:6px;width:calc(100% - 28px);color:var(--sub)}
.sheets{overflow:auto;padding:0 22px 55vh}
.shtool{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 0 10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.sheet.on{border-color:#b9b5ab;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.shead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.shead .cell.no{width:84px} .shead .cell.nm{flex:1;font-size:15px;font-weight:600;min-width:120px} .shead .cell.sc{width:auto;max-width:200px;font-family:var(--mono);font-size:12px;color:var(--sub);cursor:default}
.shead .prog{width:170px;cursor:default}
.rel{padding:6px 14px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:2px;background:#fcfbf9}
.rel a{color:var(--ink);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--mute)}
.rel .memo{color:var(--accent)}
.content{padding:6px 0 4px;border-bottom:1px solid var(--line2)}
.content:last-child{border-bottom:0}
.chead{display:flex;align-items:center;gap:6px;padding:4px 14px 2px}
.chead .cell{font-weight:600;flex:1;padding:4px 6px}
.chead .meta{font-family:var(--mono);font-size:11px;color:var(--sub);white-space:nowrap}
.chead .ico{opacity:.6}
.tasks{list-style:none;margin:0;padding:0 8px 0 14px}
.task{border-radius:5px;position:relative}
.trow{display:grid;grid-template-columns:22px 20px minmax(130px,1fr) auto auto 22px 96px minmax(64px,auto) 24px;align-items:center;gap:4px;height:32px;padding-right:4px}
.task:hover{background:#f7f6f2}
.task.hl{background:var(--inst-s)!important;box-shadow:inset 3px 0 0 var(--inst)}
.star{border:0;background:none;padding:0 2px;font-size:15px;line-height:1;color:#cfcbc2;flex:none;cursor:pointer;width:20px}
.star:hover{color:#e0a100}
.star.on{color:#e0a100;text-shadow:0 0 1px rgba(160,110,0,.4)}
.task.starred:not(.done){background:linear-gradient(90deg,#fff4c2,#fffbe9 60%,transparent);box-shadow:inset 3px 0 0 #e0a100}
.task.starred:not(.done) .ttl{font-weight:700;color:var(--ink)}
.task.starred.inst:not(.done) .ttl{color:var(--inst)}
tr.starred:not(.isdone) td{background:#fff8d6}
tr.starred:not(.isdone) .ttl{font-weight:700}
.nmw{display:flex;align-items:center;min-width:0}
.nmw .stc{font-size:11px;color:#c78a00;background:#fff4c2;border-radius:9px;padding:0 7px;margin-left:4px;white-space:nowrap;font-family:var(--mono)}
.starf{color:#a37200}
.task.flash,.content.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{background:#ffe8a3}}
.tcell{display:flex;align-items:center;gap:4px;min-width:0}
.tcell .ttl{min-width:70px}
.ttl{border:1px solid transparent;background:none;padding:4px 6px;border-radius:4px;min-width:0;width:100%}
.ttl:focus{border-color:var(--ink);background:#fff;outline:0}
.task.done .ttl{color:var(--mute);text-decoration:line-through}
.task input[type=checkbox]{margin:0;accent-color:var(--ink);width:15px;height:15px}
.kt{font-size:10px;border-radius:3px;padding:1px 4px;white-space:nowrap;flex:none;color:#fff;background:var(--c,#6b6a66)}
.kt.mtg{background:none;color:var(--c,#6b6a66);border:1px solid var(--c,#6b6a66)}
.chain{border:0;background:none;color:var(--mute);font-size:13px;width:20px;height:22px;border-radius:4px;padding:0;font-family:var(--mono)}
.chain:hover{background:var(--line2);color:var(--ink)}
.chain.serial{color:var(--accent);font-weight:700}
.chain.first{font-size:7px;text-align:center;line-height:22px;color:var(--line)}
.depchip{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:10px;padding:1px 6px;color:var(--sub);white-space:nowrap}
.ibadge{font-size:10px;font-family:var(--mono);color:var(--inst);background:var(--inst-s);border-radius:10px;padding:2px 6px;cursor:pointer;white-space:nowrap}
.ibadge.home{background:var(--inst);color:#fff}
.task.inst .ttl{color:var(--inst)} .task.inst.done .ttl{color:var(--mute)}
.task.sub{opacity:.42}
.task.sub:hover,.task.sub.hl{opacity:.9}
.subnote{grid-column:span 2;font-size:11px;color:var(--inst);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;padding-right:4px}
.asg{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:4px;background:#fff;padding:2px 2px 2px 4px;font-size:12px;width:96px}
.hrs{width:40px;border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-family:var(--mono);font-size:12px;text-align:right;background:#fff}
.rw{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sub);justify-content:flex-end}
.hrs.sum{border-color:#9db4e6;background:#f6f9ff}
.hrs.split{border-color:var(--inst);border-style:dashed;background:#fff}
.hx{font-size:9.5px;color:var(--inst);font-family:var(--mono);margin-left:-1px;min-width:18px}
.alloc{border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:grid;gap:4px}
.alloc label{display:grid;grid-template-columns:1fr 80px 14px;align-items:center;gap:6px;font-size:12.5px}
.alloc input{border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-family:var(--mono);text-align:right}
.altot{display:flex;align-items:center;gap:6px;justify-content:flex-end;border-top:1px solid var(--line2);padding-top:6px;font-size:12.5px}
.altot b{font-family:var(--mono);font-size:14px}
.due{border:1px solid var(--line);border-radius:4px;padding:1px 3px;font-family:var(--mono);font-size:11px;background:#fff;width:112px}
.due.over{border-color:var(--accent);color:var(--accent);background:var(--accent-s)}
.stchip{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:10.5px;padding:1px 7px;white-space:nowrap}
.stchip.wait{border-color:var(--warn);color:#8a5d00;background:#fdf3dc}
.stchip.done{border-color:var(--ok);color:var(--ok);background:#e6f4ec}
.memo-b{font-size:12px}
.memo-b.has{color:var(--warn)}
.task .more{opacity:.5} .task:hover .more{opacity:1}
.tmemo{padding:0 34px 6px 50px}
.tmemo textarea{width:100%;min-height:46px;border:1px solid var(--ink);border-radius:5px;padding:5px 7px;font-size:12px;resize:vertical;background:#fffef8}
.tmemo-v{margin:-4px 34px 5px 56px;font-size:11.5px;color:var(--sub);background:#fffbea;border-left:2px solid #e8d48a;padding:3px 8px;border-radius:0 4px 4px 0;cursor:text;white-space:pre-wrap;line-height:1.5}
.addtask{padding:2px 8px 6px 56px;display:flex;gap:6px}
.addtask input{flex:1;border:0;border-bottom:1px dashed var(--line);background:none;padding:5px 2px;outline:0}
.addtask input:focus{border-bottom-color:var(--ink)}
.addtask button{border:0;background:none;color:var(--inst);font-size:11px;white-space:nowrap}
.addcontent{display:block;width:100%;border:0;background:none;padding:8px;color:var(--sub);border-top:1px dashed var(--line2);font-size:12px}
.addcontent:hover{color:var(--ink);background:#faf9f6}

.treepane{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);min-width:0}
.tbar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tbar h4{margin:0;font-size:13px}
.tstats{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--sub);width:100%;flex-wrap:wrap}
.tstats b{color:var(--ink);font-weight:600}
.tstats .cp b{color:var(--accent)}
#treebox{flex:1;overflow:auto;background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:14px 14px;-webkit-overflow-scrolling:touch}
svg .tn,svg .msl{touch-action:none}
.legend{font-size:11px;color:var(--sub);display:flex;gap:4px 12px;padding:6px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink)}

svg .tn{cursor:grab}
svg .tn.dragging{cursor:grabbing;opacity:.9}
svg .tn.hl .bx{fill:var(--inst-s);stroke:var(--inst);stroke-width:2}
svg .tn.follow .bx{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 3;fill:#fff6f3}
svg .tn.swept .bx{stroke:var(--accent);stroke-width:2.4;fill:var(--accent-s)}
svg .msl{cursor:ew-resize}
svg .msl:hover .msp{stroke-width:3.5}
svg .bandbg{fill:transparent}
svg .bandbg.on{fill:var(--accent-s);opacity:.7}

/* party view */
.pv{height:100%;overflow:auto;padding:24px 36px 80px}
.pgroup{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;max-width:1100px}
.pgroup>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pgroup>header .dot{width:12px;height:12px;border-radius:3px;background:var(--c)}
.pgroup>header h3{margin:0;font-size:14px}
.pgroup>header .cnt{font-size:11.5px;color:var(--sub);font-family:var(--mono)}
.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line2);background:#faf9f6}
.ptab td{padding:5px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.ptab tr:last-child td{border-bottom:0}
.ptab tr.isdone td{color:var(--mute)}
.ptab .ttl{padding:3px 5px}
.ptab .pl a{font-family:var(--mono);font-size:11px;color:var(--ink);cursor:pointer;border-bottom:1px dotted var(--mute);margin-right:6px}
.ptab .blk{font-size:11px;color:var(--accent);font-family:var(--mono)}
.ptab .pmemo{width:100%;border:1px solid transparent;background:none;padding:3px 5px;border-radius:4px;font-size:12px;color:var(--sub)}
.ptab .pmemo:hover{border-color:var(--line)} .ptab .pmemo:focus{border-color:var(--ink);background:#fff;outline:0;color:var(--ink)}

/* tooltip/menu/modal/toast */
#tip{position:fixed;z-index:60;background:var(--ink);color:#fff;font-size:11px;padding:7px 10px;border-radius:6px;pointer-events:none;display:none;max-width:320px;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#tip b{color:#9dbbff;font-weight:600}
.menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;min-width:240px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px;font-size:12.5px}
.menu button:hover{background:var(--bg)}
.menu button.danger{color:var(--accent)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.menu .mh{font-size:10.5px;color:var(--mute);padding:4px 10px 2px}
.mbg{position:fixed;inset:0;background:rgba(28,28,26,.35);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:#fff;border-radius:10px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(860px,100%)}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px}
.mbody{padding:16px 20px;max-height:70vh;overflow:auto}
.mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.mfoot .left{margin-right:auto}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;letter-spacing:.04em}
.fld input:not([type=checkbox]):not([type=radio]):not([type=color]),.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
.fld textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cl{border:1px solid var(--line);border-radius:6px;max-height:280px;overflow:auto}
.cl label{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;cursor:pointer}
.cl label:last-child{border-bottom:0}
.cl label.dis{opacity:.4;cursor:not-allowed}
.cl .grp{padding:5px 10px;background:#faf9f6;font-size:11px;color:var(--sub);border-bottom:1px solid var(--line2);font-family:var(--mono)}
.cl .where{margin-left:auto;font-size:10.5px;color:var(--mute);font-family:var(--mono)}
.pick{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:none;padding:8px 10px}
.pick:hover{background:var(--inst-s)}
.pick small{display:block;color:var(--mute);font-family:var(--mono);font-size:10.5px;margin-top:2px}
.note{font-size:11.5px;color:var(--sub);line-height:1.7;background:#faf9f6;border-radius:6px;padding:10px 12px;margin:6px 0 12px}
.note code{font-family:var(--mono);background:#fff;border:1px solid var(--line2);padding:0 4px;border-radius:3px}
.mrow{display:grid;grid-template-columns:36px 1fr 28px;gap:8px;align-items:center;margin-bottom:6px}
.mrow.ms{grid-template-columns:36px 1fr 150px 28px}
.mrow.cap{grid-template-columns:90px 1fr}
.mrow input[type=color]{width:36px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}
.mrow input[type=text],.mrow input[type=date],.mrow input[type=number]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.pdfgrid{display:grid;grid-template-columns:1fr 220px;gap:18px}
#pvbox{background:#eeece6;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:12px;min-height:240px}
.sec{font-size:11px;color:var(--sub);letter-spacing:.08em;margin:14px 0 8px;border-bottom:1px solid var(--line2);padding-bottom:4px}
.rvtab{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
.rvtab th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.rvtab td{padding:6px 8px;border-bottom:1px solid var(--line2)}
.rvtab .n{text-align:right;font-family:var(--mono)}
.lbar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;width:140px;position:relative}
.lbar i{display:block;height:100%;background:var(--ok)}
.lbar i.warn{background:var(--warn)} .lbar i.over{background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#faf9f6;border-radius:6px;padding:8px 10px}
.kpi span{font-size:10.5px;color:var(--sub);display:block}
.kpi b{font-family:var(--mono);font-size:17px}
.kpi.bad b{color:var(--accent)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}


/* 左下の小計パネル */

/* 時間バー(達成 / 作業 / 持ち) */

.ptab2{border-collapse:separate;border-spacing:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px}

/* urgency (今期・遅れ) */

.task.starred.u-now:not(.done),.task.starred.u-late:not(.done){background:linear-gradient(90deg,#fff1b8,#fff8e0 55%,transparent)}

svg .tn.dim{opacity:.18}

<script src="team.js"></script><!-- チーム接続情報(任意)。index.html を更新しても消えないよう別ファイル -->
<script>

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k) } catch(e) { return null } };

/* ---------- dates ---------- */
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const ymLabel = k => { const [y, m] = k.split('-'); return `${+m}月`; };
const _wdm = {};
function wdInMonth(key){ if (_wdm[key]) return _wdm[key]; const [y, m] = key.split('-').map(Number); const d = new Date(y, m - 1, 1); let n = 0; while (d.getMonth() === m - 1) { const w = d.getDay(); if (w && w < 6) n++; d.setDate(d.getDate() + 1); } return _wdm[key] = n; }
const addDays = n => { const d = today0(); d.setDate(d.getDate() + n); return ymd(d); };
const parseD = s => { if (!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };

  const end = parseD(s); if (!end) return null; const d = today0(); let n = 0;
  while (d < end && n < 3000) { const w = d.getDay(); if (w && w < 6) n++; d.setDate(d.getDate() + 1); }
  return n;
}
const isOverdue = t => t.kind !== 'in' && !t.done && t.due && calDays(t.due) < 0;

/* ---------------- data ---------------- */
function defaultPdf(){ return { paper:'A3', orient:'landscape', m:{t:15,r:15,b:15,l:20}, pt:9, inc:{ms:true, list:true, links:true, detail:true, tree:false, parties:false} } }

function seedProject(){

  const xs  = t('構造に軒先部材寸法を確認', {assignee:'m1', hours:1, memo:'依頼済。電話で確認する'});
  const ev  = t('軒先・パラペット納まり検討', {assignee:'m1', hours:4, deps:[xs], star:true});

  { const t = today0(), k1 = ymKey(t), k2 = ymKey(new Date(t.getFullYear(), t.getMonth() + 1, 1)); p.mcap = { m3: { [k1]: 20, [k2]: 12 }, m1: { [k2]: 30 } }; }   // 月によって変わる例

function normalize(s){
  s.members = s.members || []; s.projects = s.projects || []; s.deleted = s.deleted || [];

{ const want = qs.get('p') || lsGet('zumentask.lastpid'); if (want && S.projects.some(p => p.id === want)) cur.pid = want; }

/* ---------------- milestones: effective band ---------------- */
// 各作業の「帯」= 自分に付けた締切と、後続作業の帯のうち早い方(後続から自動継承)
const msSorted = p => [...p.milestones].sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
function effBandsRaw(p){
  const ms = msSorted(p), M = ms.length, idx = {}; ms.forEach((m, i) => idx[m.id] = i);
  const succ = {}; Object.values(p.tasks).forEach(t => t.deps.forEach(d => (succ[d] = succ[d] || []).push(t.id)));
  const band = {}, vis = {};
  const B = id => {
    if (band[id] != null) return band[id]; if (vis[id]) return M; vis[id] = 1;
    const t = p.tasks[id]; let b = t.ms && idx[t.ms] != null ? idx[t.ms] : M;
    (succ[id] || []).forEach(s => b = Math.min(b, B(s)));
    return band[id] = b;

}
let EC = { key: null, val: null };
function eff(p){ const k = ver + '|' + p.id; if (EC.key !== k) EC = { key: k, val: effBandsRaw(p) }; return EC.val; }

const bandName = (E, b) => b < E.M ? E.ms[b].name : '未定';

function moveToBand(p, tid, j){
  const E = effBandsRaw(p), t = p.tasks[tid], cur0 = E.band[tid];
  const setMs = (task, k) => task.ms = k >= E.M ? '' : E.ms[k].id;
  if (j === cur0) return;
  setMs(t, j);
  if (j > cur0) { // 後ろへ:後続作業も連れて行く
    const stack = [...(E.succ[tid] || [])], seen = new Set();
    while (stack.length) {

      const st = p.tasks[s], own = st.ms && E.idx[st.ms] != null ? E.idx[st.ms] : E.M;
      if (own < j) setMs(st, j);

}

/* ---------------- review ---------------- */
function review(p, k){
  const E = eff(p), ms = E.ms[k], T = p.tasks;
  const ids = placedIds(p).filter(i => E.band[i] <= k), set = new Set(ids);
  const pct = progressOf(p, ids), D = workdays(ms.date), cal = calDays(ms.date);
  const remH = ids.filter(i => T[i].kind !== 'ext' && !T[i].done).reduce((a, i) => a + (+T[i].hours || 0), 0);
  const per = {}; ids.forEach(i => { const t = T[i]; if (t.kind === 'ext' || t.done || !t.hours) return; const a = t.assignee || ''; per[a] = (per[a] || 0) + (+t.hours || 0); });
  const rows = Object.keys(per).map(a => {
    const m = member(a), cap = a ? availCum(p, a, k, eff(p)) : 0;
    return { m, rem: per[a], cap, ratio: cap ? per[a] / cap : Infinity };
  }).sort((a, b) => b.ratio - a.ratio);
  // 日程(営業日):社内作業=時間÷(その人の1日あたり稼働)、外部/打合せ=日付で固定 or 所要日数
  const F = {}, vis = {};
  const fin = id => {
    if (F[id] != null) return F[id]; if (vis[id]) return 0; vis[id] = 1;
    const t = T[id]; let base = 0; t.deps.forEach(d => { if (set.has(d)) base = Math.max(base, fin(d)); });
    if (t.done) return F[id] = base;
    if (t.kind === 'in') { const perDay = t.assignee ? (perDayOf(p, t.assignee) || p.hpd) : p.hpd; return F[id] = base + (+t.hours || 0) / perDay; }
    if (t.due) return F[id] = Math.max(base, Math.max(0, workdays(t.due) || 0));
    return F[id] = base + (+t.days || 0);
  };
  let cpDays = 0; ids.forEach(i => cpDays = Math.max(cpDays, fin(i)));
  const ext = ids.filter(i => T[i].kind !== 'in' && !T[i].done);
  const overdue = ext.filter(i => isOverdue(T[i])), nodue = ext.filter(i => !T[i].due && !T[i].days);
  const worst = rows[0];
  let status = 'ok', reasons = [];
  if (pct === 100) status = 'done';
  else if (cal != null && cal < 0) { status = 'over'; reasons.push('締切超過'); }
  else {
    rows.forEach(r => { if (!r.m) return; if (r.ratio > 1) reasons.push(`${r.m.name} ${Math.round(r.ratio * 100)}%`); });
    if (D != null && cpDays > D) reasons.push(`日程 ${cpDays.toFixed(1)}/${D}日`);
    if (reasons.length) status = 'over';
    else {
      if (rows.some(r => r.m && r.ratio > .85)) reasons.push(`${worst.m.name} ${Math.round(worst.ratio * 100)}%`);
      if (D != null && cpDays > D * .85) reasons.push('日程に余裕なし');
      if (overdue.length) reasons.push(`回答遅れ${overdue.length}件`);
      if (rows.some(r => !r.m)) reasons.push('担当未定あり');
      if (reasons.length) status = 'warn';
    }
  }
  return { ms, k, ids, pct, D, cal, remH, rows, cpDays, ext, overdue, nodue, status, reasons };
}

function volTable(p){

    return { n: g.length, h: g.reduce((a, i) => a + (+T[i].hours || 0), 0), r: g.filter(i => !T[i].done).reduce((a, i) => a + (+T[i].hours || 0), 0) }; };
  const usedCols = cols.filter(c => c.m || ids.some(i => !T[i].assignee));

  const td = (x, av) => { if (!x.n) return '<td class="vz">—</td>'; const cls = av != null ? (av ? (x.r / av > 1 ? 'h-over' : x.r / av > .85 ? 'h-warn' : 'h-ok') : (x.r ? 'h-over' : '')) : '';

  const tot = { n: 0, h: 0, r: 0 };

    return `<tr><th class="l" style="--c:${bandColor(E, b)}"><span>● ${esc(trunc(periodName(E, b), 16))}</span>${b < E.M ? `<small>→ ◆${esc(trunc(E.ms[b].name, 10))} ${esc((E.ms[b].date || '').slice(5).replace('-', '/'))}</small>` : ''}</th>
      ${usedCols.map(c => td(cell(b, c.id), c.m && b < E.M ? availInt(p, c.id, b, E).h : null)).join('')}${td(all, b < E.M ? S.members.reduce((a, m) => a + availInt(p, m.id, b, E).h, 0) : null).replace('<td', '<td class="vt"').replace('class="vt" class="', 'class="vt ')}</tr>`; }).join('');
  const colTot = c => { const g = ids.filter(i => (T[i].assignee || '') === c.id); return { n: g.length, h: g.reduce((a, i) => a + (+T[i].hours || 0), 0), r: g.filter(i => !T[i].done).reduce((a, i) => a + (+T[i].hours || 0), 0) }; };

    ${rows}<tr class="vsum"><th class="l">合計</th>${usedCols.map(c => td(colTot(c), null)).join('')}${td(tot, null)}</tr></table></div>
    <div class="note" style="max-width:1150px;margin-top:4px">各マス:<b>残り工数</b> / 計(完了分を含む)・件数。%は「その期間の残り ÷ その人がその期間内(本日以降)に使える時間」で、85%超で黄、100%超で赤。上の絞り込み(ゾーン・状態など)を変えると、例えば「作図だけのボリューム」も見られます。</div>`;
}

const noCmp = (a, b) => { if (!a.no && !b.no) return 0; if (!a.no) return 1; if (!b.no) return -1; return String(a.no).localeCompare(String(b.no), 'ja', { numeric: true, sensitivity: 'base' }); };
function sortDrawings(p){ if (p.numMode !== 'sort') return false; const before = p.drawings.map(d => d.id).join(); p.drawings.sort(noCmp); return before !== p.drawings.map(d => d.id).join(); }
function guessRule(p){ // 先頭の図面番号から採番ルールを推定(例:A-101 → 接頭辞「A-」、101から、3桁)
  const m = String(p.drawings[0]?.no || 'A-101').match(/^(.*?)(\d+)(\D*)$/);
  return m ? { prefix: m[1], start: +m[2], width: m[2].length, step: 1, suffix: m[3] } : { prefix: 'A-', start: 101, width: 3, step: 1, suffix: '' };
}
const ruleNo = (r, i) => r.prefix + String(r.start + i * r.step).padStart(r.width, '0') + (r.suffix || '');

      p.numRule = { prefix: $('#nr_p', bg).value, start: parseInt($('#nr_s', bg).value) || 0, width: Math.max(1, parseInt($('#nr_w', bg).value) || 1), step: Math.max(1, parseInt($('#nr_t', bg).value) || 1), suffix: r.suffix || '' };

function addTask(did, cid, title){

  modal('関係線の追加', `<div class="cl">${p.drawings.filter(d => d.id !== from).map(d => `<button class="pick" data-id="${d.id}">${esc(d.no)} ${esc(d.name)}</button>`).join('')}</div>`, [{ label: '閉じる' }],
    { mount(bg){ $$('.pick', bg).forEach(b => b.onclick = () => { closeModal(); createLink(from, b.dataset.id); }); } });
}
function createLink(from, to){
  const p = P();
  if (p.links.some(l => l.from === from && l.to === to)) return toast('同じ関係線が既にあります');
  const l = { id: uid(), from, to, memo: '' }; p.links.push(l); commit(); editLink(l.id, true);
}
function editLink(lid, isNew){
  const p = P(), l = p.links.find(x => x.id === lid); if (!l) return;
  const dn = id => { const d = p.drawings.find(x => x.id === id); return d ? `${esc(d.no)} ${esc(d.name)}` : '?'; };
  modal(isNew ? '関係線のメモ' : '関係線の編集', `<div class="note" style="font-size:13px"><b>${dn(l.from)}</b> → <b>${dn(l.to)}</b></div>
    <label class="fld"><span>メモ(例:この詳細図の検討が終わったら矩計図に反映)</span><textarea id="lm">${esc(l.memo)}</textarea></label>`,
    [{ label: '削除', cls: 'left', run(){ p.links = p.links.filter(x => x.id !== lid); commit(); } },
     { label: '向きを反転', run(bg){ l.memo = $('#lm', bg).value; [l.from, l.to] = [l.to, l.from]; commit(); } },
     { label: '保存', cls: 'pri', run(bg){ l.memo = $('#lm', bg).value; commit(); } }]);
}

  modal('マイルストーン(締切)と期間', `
    <div class="msstart"><span class="lbl">▶ 設計開始</span><input type="date" id="pstart" value="${esc(p.start || '')}"><span class="muted" style="font-size:11px">最初の期間はここから始まります(締切は不要)</span></div>

    <label class="fld" style="width:50%;margin-top:10px"><span>担当未定の作業の1日あたり時間(h)</span><input id="hpd" type="number" min="1" step="0.5" value="${p.hpd}"></label>

    [{ label: 'キャンセル' }, { label: '保存', cls: 'pri', run(bg){

function openReview(k){

    <div class="sec">人ごとの負荷(この締切までに終える必要がある残り作業)</div>
    ${memRows ? `<table class="rvtab"><tr><th>担当</th><th class="n">残り工数</th><th class="n">使える時間</th><th>負荷</th><th class="n">負荷率</th></tr>${memRows}</table>` : '<div class="muted">残っている社内作業はありません</div>'}

function readPdf(bg){
  const o = P().pdf, n = (id, d) => { const v = parseFloat($(id, bg).value); return isNaN(v) ? d : Math.max(0, v); };
  o.paper = $('#pp', bg).value; o.orient = $('#po', bg).value;
  o.m = { t: n('#mt', 15), r: n('#mr', 15), b: n('#mb', 15), l: n('#ml2', 20) }; o.pt = n('#pt', 9) || 9;
  o.inc = { ms: $('#i0', bg).checked, list: $('#i1', bg).checked, links: $('#i2', bg).checked, detail: $('#i3', bg).checked, tree: $('#i4', bg).checked };
}
function paperWH(o){ let [w, h] = PAPER[o.paper] || PAPER.A3; if (o.orient === 'landscape') [w, h] = [h, w]; return [w, h]; }
function drawPreview(){
  const o = P().pdf, [w, h] = paperWH(o), s = 200 / Math.max(w, h), W = w * s, H = h * s;
  const ok = o.m.l + o.m.r < w && o.m.t + o.m.b < h;
  $('#pvbox').innerHTML = `<svg width="${W + 40}" height="${H + 40}" viewBox="-20 -20 ${W + 40} ${H + 40}" font-family="ui-monospace,monospace" font-size="9">
    <rect width="${W}" height="${H}" fill="#fff" stroke="#999"/>
    <rect x="${o.m.l * s}" y="${o.m.t * s}" width="${Math.max(0, (w - o.m.l - o.m.r) * s)}" height="${Math.max(0, (h - o.m.t - o.m.b) * s)}" fill="${ok ? '#fbe9e4' : '#fdd'}" stroke="#d2462b" stroke-dasharray="3 2"/>
    <text x="${W / 2}" y="-6" text-anchor="middle" fill="#555">${o.paper} ${w}×${h}</text>
    <text x="${W / 2}" y="${o.m.t * s / 2 + 3}" text-anchor="middle" fill="#d2462b">${o.m.t}</text>
    <text x="${W / 2}" y="${H - o.m.b * s / 2 + 3}" text-anchor="middle" fill="#d2462b">${o.m.b}</text>
    <text x="${o.m.l * s / 2}" y="${H / 2}" text-anchor="middle" fill="#d2462b">${o.m.l}</text>
    <text x="${W - o.m.r * s / 2}" y="${H / 2}" text-anchor="middle" fill="#d2462b">${o.m.r}</text>
    <text x="${W / 2}" y="${H / 2 + 3}" text-anchor="middle" fill="#888">印刷範囲 ${Math.round(w - o.m.l - o.m.r)}×${Math.round(h - o.m.t - o.m.b)}</text></svg>`;
}

function printLinks(p, gw, rowH, headH){
  const { L, nl } = laneLinks(p);
  const H = headH + p.drawings.length * rowH, yc = i => headH + i * rowH + rowH / 2;
  let s = `<svg style="position:absolute;left:100%;top:0;overflow:visible" width="${gw}mm" height="${H}mm" viewBox="0 0 ${gw} ${H}">
    <defs><marker id="pah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="pdot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4"><circle cx="5" cy="5" r="3.8" fill="#333"/></marker></defs>`;
  const LX = 5 + nl * 5 + 2;
  spreadEnds(L, yc, rowH * .32);
  L.forEach(o => o.my = (o.ya + o.yb) / 2);
  [...L].sort((a, b) => a.my - b.my).reduce((last, o) => { o.ly = Math.max(o.my, last + 3.6); return o.ly; }, -1e9);
  const maxCh = Math.max(6, Math.floor((gw - LX) / 2.7));
  L.forEach(o => {
    const x = 5 + o.lane * 5, y1 = o.ya, y2 = o.yb, sg = y2 > y1 ? 1 : -1, r = Math.min(1.5, Math.abs(y2 - y1) / 2);
    s += `<path d="M0.9,${y1} H${x - r} Q${x},${y1} ${x},${y1 + sg * r} V${y2 - sg * r} Q${x},${y2} ${x - r},${y2} H1.5" fill="none" stroke="#333" stroke-width=".3" marker-start="url(#pdot)" marker-end="url(#pah)"/>`;
    s += `<path d="M${x},${o.my} L${LX - .8},${o.ly - .9}" stroke="#c0392b" stroke-width=".15" stroke-dasharray=".6 .6" fill="none"/>`;
    s += `<text x="${LX}" y="${o.ly}" font-size="2.6" fill="#c0392b">${esc(trunc(o.l.memo, maxCh))}</text>`;
  });
  return s + '</svg>';
}

/* チーム配布:接続情報をパスコードで暗号化 (PBKDF2 + AES-GCM) */
const b64e = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function passKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptCfg(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await passKey(pass, salt), new TextEncoder().encode(JSON.stringify(obj)));
  return [b64e(salt), b64e(iv), b64e(ct)].join('.');
}
async function decryptCfg(str, pass){
  const [s, i, c] = str.split('.').map(b64d);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: i }, await passKey(pass, s), c);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function dbxDownload(){

function mergeRemote(remote){

  if (!dirty) { S = remote; return; }
  const del = new Set([...(S.deleted || []), ...(remote.deleted || [])]);
  const map = {};
  remote.projects.forEach(p => map[p.id] = p);
  S.projects.forEach(p => { const r = map[p.id]; if (!r || (p.updatedAt || 0) >= (r.updatedAt || 0)) map[p.id] = p; });
  const order = [...S.projects.map(p => p.id), ...remote.projects.map(p => p.id)].filter((id, i, a) => a.indexOf(id) === i);
  const mem = {}; remote.members.forEach(m => mem[m.id] = m); S.members.forEach(m => mem[m.id] = m);

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function dbxConnect(){
  if (!crypto.subtle) return toast('https(GitHub Pages等)で開いてください');
  const verf = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verf)));
  lsSet('zumentask.pkce', JSON.stringify({ ver: verf, pid: cur.pid }));
  const redirect = location.origin + location.pathname;
  location.href = `https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(cfg.appKey)}&response_type=code&code_challenge=${ch}&code_challenge_method=S256&token_access_type=offline&redirect_uri=${encodeURIComponent(redirect)}`;
}
async function handleOAuth(){

  history.replaceState(null, '', location.pathname + (pk?.pid ? '?p=' + pk.pid : ''));
  if (!pk) return;
  if (pk.pid && S.projects.some(p => p.id === pk.pid)) cur.pid = pk.pid;
  try {
    const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ code, grant_type: 'authorization_code', code_verifier: pk.ver, client_id: cfg.appKey, redirect_uri: location.origin + location.pathname }) });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json(); cfg.refresh = j.refresh_token; cfg.token = ''; access = { tok: j.access_token, exp: Date.now() + j.expires_in * 1000 }; saveCfg();
    lsSet('zumentask.pkce', ''); rev = null; dirty = true;

}

  $$('.drow.dragover,.drow.dragafter').forEach(x => x.classList.remove('dragover', 'dragafter'));
  if (mark) mark.classList.add('dragover'); else if (rows.length) rows[rows.length - 1].classList.add('dragafter');
});
document.addEventListener('pointerup', () => {
  if (!rowDrag) return;
  const d = rowDrag; rowDrag = null;
  d.row.style.transform = ''; d.row.classList.remove('dragging');
  $$('.drow.dragover,.drow.dragafter').forEach(x => x.classList.remove('dragover', 'dragafter'));
  if (d.to == null || d.to === d.from) return;
  const p = P(), [dr] = p.drawings.splice(d.from, 1); p.drawings.splice(d.to, 0, dr);
  renumber(p); flashDid = dr.id; commit();
  if (p.numMode === 'renumber') toast(`${dr.name} を移動し、番号を振り直しました`);
});
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

/* ---------------- boot ---------------- */
lsSet('zumentask.lastpid', cur.pid);
render(); setStatus();
handleOAuth().then(() => {
  if (syncEnabled() && !qs.get('code')) sync();
  else if (!syncEnabled() && ENC && !lsGet('zumentask.localonly')) {
    if (TEAM_PASS) unlockWith(TEAM_PASS).catch(() => openUnlock());   // パスコード埋め込み済み:自動接続
    else openUnlock();
  }
});
</script>
</body>
</html>
