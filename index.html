<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZUMEN TASK — 図面リスト型タスク管理</title>
<style>
:root{
  --bg:#f5f4f0; --paper:#fff; --ink:#1c1c1a; --sub:#6b6a66; --mute:#a8a6a0;
  --line:#dedbd3; --line2:#ebe8e1; --accent:#d2462b; --accent-s:#fbe9e4;
  --inst:#2457c5; --inst-s:#e6edfb; --ok:#2f8f5b; --warn:#c98a12;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--mute)}

/* header */
#top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:5}
.logo{font-family:var(--mono);font-weight:700;letter-spacing:.12em;font-size:14px;white-space:nowrap}
.logo b{color:var(--accent)}
#projSel{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;max-width:240px}
.tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:5px;color:var(--sub);white-space:nowrap}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.sp{flex:1}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 10px;white-space:nowrap}
.tbtn:hover{border-color:var(--ink)}
.tbtn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbtn:disabled{opacity:.4;cursor:default}
#sync{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
#sync.ok i{background:var(--ok)} #sync.pending i{background:var(--warn)} #sync.sync i{background:var(--inst);animation:pulse 1s infinite} #sync.err i{background:var(--accent)}
@keyframes pulse{50%{opacity:.3}}
#app{height:calc(100vh - 52px);overflow:hidden}

/* list view */
.lv{height:100%;overflow:auto;padding:24px 36px 80px}
.lvbar{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.lvbar h2{margin:0;font-size:20px;font-weight:600}
.lvbar .stat{font-family:var(--mono);color:var(--sub);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;color:var(--sub)}
.seg button.on{background:var(--ink);color:#fff}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);cursor:pointer}
.mscards{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:stretch}
.mscard{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:10px 12px;width:210px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mscard:hover{border-color:#b9b5ab;border-top-color:var(--c)}
.mscard .n{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mscard .d{font-family:var(--mono);font-size:11px;color:var(--sub)}
.mscard .big{font-family:var(--mono);font-size:20px;font-weight:600;margin:2px 0}
.mscard .big small{font-size:11px;color:var(--sub);font-weight:400;margin-left:6px}
.judge{font-size:11.5px;display:flex;align-items:center;gap:5px}
.judge i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.j-ok i{background:var(--ok)} .j-warn i{background:var(--warn)} .j-over i{background:var(--accent)} .j-done i{background:var(--mute)}
.j-over{color:var(--accent)} .j-warn{color:#8a5d00}
.msadd{border:1px dashed var(--line);background:none;border-radius:8px;width:120px;color:var(--sub);font-size:12px}
.msadd:hover{color:var(--ink);border-color:var(--ink)}
.dlist{position:relative;width:830px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.drow,.crow{display:grid;grid-template-columns:22px 20px 96px 1fr 84px 220px 26px 22px 28px;align-items:center;height:40px;border-bottom:1px solid var(--line2);position:relative}
.drow:last-of-type{border-bottom:0}
.drow.head{height:34px;font-size:11px;color:var(--sub);letter-spacing:.06em;background:#faf9f6;border-radius:8px 8px 0 0;border-bottom:1px solid var(--line)}
.drow.head div{padding:0 8px}
.drow:not(.head):hover{background:#fbfaf7}
.drow.hl{background:var(--accent-s)!important}
.drow.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.drow.flash{animation:flash 1.4s}
.caret{border:0;background:none;color:var(--sub);font-size:10px;width:20px;height:24px;padding:0;border-radius:4px;justify-self:end}
.caret:hover{background:var(--line2);color:var(--ink)}
.caret.none{visibility:hidden}
.crow{height:30px;background:#fbfaf7;border-bottom:1px solid var(--line2);font-size:12px}
.crow .cn{grid-column:4;padding-left:20px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.crow .cn::before{content:"└ ";color:var(--line)}
.crow .cn:hover{color:var(--ink);text-decoration:underline}
.crow .cm{grid-column:5;font-family:var(--mono);font-size:10.5px;color:var(--mute);padding:0 8px;white-space:nowrap}
.crow .prog{grid-column:6;cursor:pointer}
.crow .sbar{height:5px}
.crow .ico{grid-column:7}
.tbtn.sm{padding:3px 8px;font-size:11.5px}
/* member view */
.mv{height:100%;overflow:auto;padding:24px 36px 80px}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;margin-bottom:18px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px}
.heat th{font-size:11px;color:var(--sub);font-weight:500;padding:4px 8px;text-align:center;white-space:nowrap}
.heat th.l{text-align:left}
.heat td{padding:6px 10px;border-radius:5px;text-align:center;font-family:var(--mono);min-width:110px;cursor:pointer}
.heat td.l{text-align:left;font-family:var(--sans);background:none;min-width:90px;cursor:default}
.heat td b{display:block;font-size:14px}
.heat td small{font-size:10px;color:var(--sub)}
.h-ok{background:#e3f2e9}.h-warn{background:#fcefcf}.h-over{background:#f9d9d1}.h-none{background:#f3f1ec;color:var(--mute)}
.h-over b{color:var(--accent)}
.mcard{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;margin-bottom:16px;max-width:1150px}
.mcard>header{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.mcard>header h3{margin:0;font-size:15px}
.mcard .capin{width:56px;border:1px solid var(--line);border-radius:4px;padding:2px 5px;font-family:var(--mono);text-align:right}
.mcard .kv{font-size:11.5px;color:var(--sub);font-family:var(--mono)}
.mcard .kv b{color:var(--ink);font-size:13px}
.xproj{font-size:11px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.xproj span{background:var(--bg);border-radius:10px;padding:1px 8px;font-family:var(--mono)}
.xproj .warn{background:var(--accent-s);color:var(--accent)}
.mbars{padding:10px 14px 4px;display:grid;grid-template-columns:170px 1fr 150px;gap:6px 12px;align-items:center;font-size:12px}
.mbars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbars .nm i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.lb{position:relative;height:14px;background:var(--line2);border-radius:3px;overflow:hidden}
.lb>i{position:absolute;top:0;bottom:0;left:0;background:var(--c);opacity:.85}
.lb>em{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.mbars .num{font-family:var(--mono);font-size:11px;text-align:right}
.mbars .num.over{color:var(--accent);font-weight:600}
.mbars .num.warn{color:#8a5d00}
.mtasks{width:100%;border-collapse:collapse;font-size:12.5px}
.mtasks th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line2);background:#faf9f6}
.mtasks td{padding:3px 8px;border-bottom:1px solid var(--line2)}
.mtasks tr.isdone td{color:var(--mute)} .mtasks tr.isdone .ttl{text-decoration:line-through;color:var(--mute)}
.mtasks .pl{font-family:var(--mono);font-size:11px;color:var(--sub)}
.mtasks details{padding:0}
.mtasks .hrs{width:50px}
.grip{color:var(--mute);cursor:grab;text-align:center;font-size:11px;letter-spacing:-2px;user-select:none}
.cell{border:1px solid transparent;background:none;padding:5px 8px;border-radius:4px;width:100%;min-width:0}
.cell:hover{border-color:var(--line)} .cell:focus{border-color:var(--ink);background:#fff;outline:0}
.cell.no,.cell.sc{font-family:var(--mono);font-size:12px}
.prog{display:flex;align-items:center;gap:8px;padding:0 8px;cursor:pointer;min-width:0}
.sbar{display:flex;gap:2px;height:7px;flex:1;min-width:0}
.sbar span{position:relative;border-radius:2px;overflow:hidden;background:#ece9e2;min-width:4px}
.sbar span::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.2}
.sbar span i{position:relative;display:block;height:100%;background:var(--c)}
.pct{font-family:var(--mono);font-size:12px;width:40px;text-align:right;flex:none}
.ico{border:0;background:none;color:var(--mute);border-radius:4px;width:24px;height:24px;line-height:1;padding:0}
.ico:hover{background:var(--line2);color:var(--ink)}
.drow .del{opacity:0} .drow:hover .del{opacity:1}
.port{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mute);background:#fff;padding:0;justify-self:center}
.port:hover,.port.on{border-color:var(--accent);background:var(--accent)}
.linking .port{border-color:var(--accent)}
.addrowbtn{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:none;padding:9px;color:var(--sub);border-radius:0 0 8px 8px}
.addrowbtn:hover{background:#faf9f6;color:var(--ink)}
.linksvg{position:absolute;top:0;left:calc(100% - 14px);overflow:visible;pointer-events:none}
.linksvg .lk{pointer-events:stroke;cursor:pointer}
.linksvg .lbl{pointer-events:all;cursor:pointer}
.linksvg .lk:hover,.linksvg g.hov .lk{stroke:var(--accent)}
.hint{color:var(--sub);font-size:12px;margin-top:14px;line-height:1.8}
.hint kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:#fff;font-size:11px}
.linkbanner{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.legendms{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:8px 0 0}
.legendms span{display:inline-flex;align-items:center;gap:4px}
.legendms i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}

/* detail view */
.dv{display:grid;grid-template-columns:210px minmax(460px,1fr) minmax(380px,42%);height:100%}
.dv.wide{grid-template-columns:180px minmax(360px,30%) 1fr}
.zoom{display:inline-flex;align-items:center;gap:2px;margin-left:auto}
.zoom button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:2px 7px;font-size:12px}
.zoom span{font-family:var(--mono);font-size:11px;width:40px;text-align:center;color:var(--sub)}
.side{border-right:1px solid var(--line);overflow:auto;background:#faf9f6;padding:10px 0}
.side h4{margin:4px 14px 8px;font-size:11px;color:var(--sub);letter-spacing:.08em;font-weight:500}
.sitem{display:grid;grid-template-columns:58px 1fr 34px;gap:4px;align-items:center;padding:7px 14px;cursor:pointer;border-left:3px solid transparent}
.sitem:hover{background:#f1efe9}
.sitem.on{background:var(--paper);border-left-color:var(--ink)}
.sitem.hl{background:var(--inst-s);border-left-color:var(--inst)}
.sitem .no{font-family:var(--mono);font-size:11px;color:var(--sub)}
.sitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .pc{font-family:var(--mono);font-size:11px;text-align:right;color:var(--sub)}
.side .addd{margin:10px 14px;border:1px dashed var(--line);background:none;border-radius:6px;padding:6px;width:calc(100% - 28px);color:var(--sub)}
.sheets{overflow:auto;padding:0 22px 120px}
.shtool{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 0 10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.sheet.on{border-color:#b9b5ab;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.shead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.shead .cell.no{width:84px} .shead .cell.nm{flex:1;font-size:15px;font-weight:600;min-width:120px} .shead .cell.sc{width:70px}
.shead .prog{width:200px;cursor:default}
.rel{padding:6px 14px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:2px;background:#fcfbf9}
.rel a{color:var(--ink);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--mute)}
.rel .memo{color:var(--accent)}
.content{padding:6px 0 4px;border-bottom:1px solid var(--line2)}
.content:last-child{border-bottom:0}
.chead{display:flex;align-items:center;gap:6px;padding:4px 14px 2px}
.chead .cell{font-weight:600;flex:1;padding:4px 6px}
.chead .meta{font-family:var(--mono);font-size:11px;color:var(--sub);white-space:nowrap}
.chead .ico{opacity:.6}
.tasks{list-style:none;margin:0;padding:0 8px 0 14px}
.task{border-radius:5px;position:relative}
.trow{display:grid;grid-template-columns:22px 20px minmax(0,1fr) auto auto 22px 96px auto 24px;align-items:center;gap:4px;height:32px;padding-right:4px}
.task:hover{background:#f7f6f2}
.task.hl{background:var(--inst-s)!important;box-shadow:inset 3px 0 0 var(--inst)}
.task.flash,.content.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{background:#ffe8a3}}
.tcell{display:flex;align-items:center;gap:4px;min-width:0}
.ttl{border:1px solid transparent;background:none;padding:4px 6px;border-radius:4px;min-width:0;width:100%}
.ttl:focus{border-color:var(--ink);background:#fff;outline:0}
.task.done .ttl{color:var(--mute);text-decoration:line-through}
.task input[type=checkbox]{margin:0;accent-color:var(--ink);width:15px;height:15px}
.kt{font-size:10px;border-radius:3px;padding:1px 4px;white-space:nowrap;flex:none;color:#fff;background:var(--c,#6b6a66)}
.kt.mtg{background:none;color:var(--c,#6b6a66);border:1px solid var(--c,#6b6a66)}
.chain{border:0;background:none;color:var(--mute);font-size:13px;width:20px;height:22px;border-radius:4px;padding:0;font-family:var(--mono)}
.chain:hover{background:var(--line2);color:var(--ink)}
.chain.serial{color:var(--accent);font-weight:700}
.chain.first{font-size:7px;text-align:center;line-height:22px;color:var(--line)}
.depchip{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:10px;padding:1px 6px;color:var(--sub);white-space:nowrap}
.ibadge{font-size:10px;font-family:var(--mono);color:var(--inst);background:var(--inst-s);border-radius:10px;padding:2px 6px;cursor:pointer;white-space:nowrap}
.ibadge.home{background:var(--inst);color:#fff}
.task.inst .ttl{color:var(--inst)} .task.inst.done .ttl{color:var(--mute)}
.task.sub{opacity:.42}
.task.sub:hover,.task.sub.hl{opacity:.9}
.subnote{grid-column:span 2;font-size:11px;color:var(--inst);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;padding-right:4px}
.asg{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:4px;background:#fff;padding:2px 2px 2px 4px;font-size:12px;width:96px}
.hrs{width:40px;border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-family:var(--mono);font-size:12px;text-align:right;background:#fff}
.rw{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sub);justify-content:flex-end}
.due{border:1px solid var(--line);border-radius:4px;padding:1px 3px;font-family:var(--mono);font-size:11px;background:#fff;width:112px}
.due.over{border-color:var(--accent);color:var(--accent);background:var(--accent-s)}
.stchip{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:10.5px;padding:1px 7px;white-space:nowrap}
.stchip.wait{border-color:var(--warn);color:#8a5d00;background:#fdf3dc}
.stchip.done{border-color:var(--ok);color:var(--ok);background:#e6f4ec}
.memo-b{font-size:12px}
.memo-b.has{color:var(--warn)}
.task .more{opacity:.5} .task:hover .more{opacity:1}
.tmemo{padding:0 34px 6px 50px}
.tmemo textarea{width:100%;min-height:46px;border:1px solid var(--ink);border-radius:5px;padding:5px 7px;font-size:12px;resize:vertical;background:#fffef8}
.tmemo-v{margin:-4px 34px 5px 56px;font-size:11.5px;color:var(--sub);background:#fffbea;border-left:2px solid #e8d48a;padding:3px 8px;border-radius:0 4px 4px 0;cursor:text;white-space:pre-wrap;line-height:1.5}
.addtask{padding:2px 8px 6px 56px;display:flex;gap:6px}
.addtask input{flex:1;border:0;border-bottom:1px dashed var(--line);background:none;padding:5px 2px;outline:0}
.addtask input:focus{border-bottom-color:var(--ink)}
.addtask button{border:0;background:none;color:var(--inst);font-size:11px;white-space:nowrap}
.addcontent{display:block;width:100%;border:0;background:none;padding:8px;color:var(--sub);border-top:1px dashed var(--line2);font-size:12px}
.addcontent:hover{color:var(--ink);background:#faf9f6}

.treepane{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);min-width:0}
.tbar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tbar h4{margin:0;font-size:13px}
.tstats{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--sub);width:100%;flex-wrap:wrap}
.tstats b{color:var(--ink);font-weight:600}
.tstats .cp b{color:var(--accent)}
#treebox{flex:1;overflow:auto;background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:14px 14px;touch-action:none}
.legend{font-size:11px;color:var(--sub);display:flex;gap:4px 12px;padding:6px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink)}

svg .tn{cursor:grab}
svg .tn.dragging{cursor:grabbing;opacity:.9}
svg .tn.hl .bx{fill:var(--inst-s);stroke:var(--inst);stroke-width:2}
svg .tn.follow .bx{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 3;fill:#fff6f3}
svg .tn.swept .bx{stroke:var(--accent);stroke-width:2.4;fill:var(--accent-s)}
svg .msl{cursor:ew-resize}
svg .msl:hover .msp{stroke-width:3.5}
svg .bandbg{fill:transparent}
svg .bandbg.on{fill:var(--accent-s);opacity:.7}

/* party view */
.pv{height:100%;overflow:auto;padding:24px 36px 80px}
.pgroup{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;max-width:1100px}
.pgroup>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pgroup>header .dot{width:12px;height:12px;border-radius:3px;background:var(--c)}
.pgroup>header h3{margin:0;font-size:14px}
.pgroup>header .cnt{font-size:11.5px;color:var(--sub);font-family:var(--mono)}
.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line2);background:#faf9f6}
.ptab td{padding:5px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.ptab tr:last-child td{border-bottom:0}

<script>
const SRC0 = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;   // 配布用HTML生成のための自身のソース
/* =========================================================
   ZUMEN/TASK v2 — 図面リスト型タスク管理
   単一HTML / localStorage + Dropbox(App folder)同期
   ========================================================= */

// ▼ チーム配布用:App keyとリフレッシュトークンを埋め込むと、メンバーはURLを開くだけで同じデータを共有できます
const EMBED = { appKey: '', refresh: '', token: '', path: '' };   // 平文(非推奨:URLを知る誰でも接続可能)
// ▼ 「設定・共有 → 配布用HTMLを作成」で自動的に書き込まれる、チームパスコードで暗号化した接続情報
const EMBED_ENC = '';

const LS_KEY = 'zumentask.v1', CFG_KEY = 'zumentask.cfg', UI_KEY = 'zumentask.ui';
const PAPER = { A4:[210,297], A3:[297,420], B4:[257,364], A2:[420,594] };
const COLORS = ['#d2462b','#2457c5','#2f8f5b','#c98a12','#7b4bc4','#1a8a9a','#b8336a','#5b6770'];
const KIND = { in:'社内', ext:'外部', mtg:'打合せ' };
const NOBAND = '#9a978f';

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k) } catch(e) { return null } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v) } catch(e) {} };
const fmtH = h => { h = +h || 0; return (Math.round(h * 10) / 10).toString() };
const trunc = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s };

/* ---------- dates ---------- */
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = n => { const d = today0(); d.setDate(d.getDate() + n); return ymd(d); };
const parseD = s => { if (!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const fmtD = s => { const d = parseD(s); return d ? `${d.getMonth()+1}/${d.getDate()}` : '—'; };
const calDays = s => { const d = parseD(s); return d ? Math.round((d - today0()) / 864e5) : null; };
function workdays(s){ // 本日〜締切前日の平日数
  const end = parseD(s); if (!end) return null; const d = today0(); let n = 0;
  while (d < end && n < 3000) { const w = d.getDay(); if (w && w < 6) n++; d.setDate(d.getDate() + 1); }
  return n;
}
const isOverdue = t => t.kind !== 'in' && !t.done && t.due && calDays(t.due) < 0;

/* ---------------- data ---------------- */
function defaultPdf(){ return { paper:'A3', orient:'landscape', m:{t:15,r:15,b:15,l:20}, pt:9, inc:{ms:true, list:true, links:true, detail:true, tree:false, parties:false} } }
function newProject(name){
  return { id: uid(), name: name || '新規プロジェクト', updatedAt: Date.now(), progressMode:'count',
           drawings: [], tasks: {}, links: [], milestones: [], parties: [], cap: {}, hpd: 8, pdf: defaultPdf() };
}
function seedProject(){
  const p = newProject('サンプル邸 実施設計');
  const M1 = {id:uid(), name:'積算図渡し①(基本図)', date:addDays(16), color:'#2457c5'};
  const M2 = {id:uid(), name:'確認申請', date:addDays(58), color:'#d2462b'};
  const M3 = {id:uid(), name:'積算図渡し②(詳細図)', date:addDays(93), color:'#2f8f5b'};
  p.milestones = [M1, M2, M3];
  const PC = {id:uid(), name:'クライアント', color:'#b8336a'}, PS = {id:uid(), name:'構造設計', color:'#7b4bc4'},
        PE = {id:uid(), name:'設備設計', color:'#1a8a9a'}, PG = {id:uid(), name:'確認検査機関', color:'#5b6770'};
  p.parties = [PC, PS, PE, PG];
  const T = p.tasks;
  const t = (title, o) => { const id = uid(); T[id] = Object.assign({id, title, kind:'in', assignee:'', hours:0, deps:[], done:false, memo:'', ms:'', home:'', party:'', st:'req', due:'', days:0}, o); return id; };
  const xe  = t('配管ルート案の提出依頼', {kind:'ext', party:PE.id, st:'wait', due:addDays(5), memo:'PS寸法の前提になるので早めに催促'});
  const r1  = t('設備配管の管理ルート確認', {assignee:'m2', hours:3, deps:[xe]});
  const ps  = t('PS・EPS位置の確定', {assignee:'m2', hours:2, deps:[r1]});
  const st  = t('階段寸法(蹴上げ・踏面)確定', {assignee:'m1', hours:2, done:true});
  const f1  = t('1F 間仕切り・建具位置の作図', {assignee:'m3', hours:6, deps:[ps], ms:M1.id});
  const f2  = t('2F 間仕切り・建具位置の作図', {assignee:'m3', hours:5, deps:[ps], ms:M1.id});
  const xk  = t('キッチン仕様の決定', {kind:'ext', party:PC.id, st:'req', due:addDays(24)});
  const fur = t('家具・什器レイアウト反映', {assignee:'m3', hours:3, deps:[f1, xk], ms:M3.id});
  const el  = t('外壁仕上げ割付', {assignee:'m1', hours:4, done:true, ms:M1.id});
  const win = t('サッシ割付・開口寸法確定', {assignee:'m1', hours:3, deps:[el]});
  const mt  = t('定例:天井高さの承認', {kind:'mtg', party:PC.id, due:addDays(9), hours:1.5, assignee:'m1'});
  const cl  = t('天井高さ・天井懐寸法の決定', {assignee:'m1', hours:2, deps:[r1, mt]});
  const sec = t('A-A断面の作図', {assignee:'m3', hours:4, deps:[cl, st], ms:M2.id});
  const xs  = t('軒先部材寸法の回答', {kind:'ext', party:PS.id, st:'wait', due:addDays(-2), memo:'11/13に依頼済。電話で確認する'});
  const ev  = t('軒先・パラペット納まり検討', {assignee:'m1', hours:4, deps:[xs]});
  const kn  = t('矩計図の作図', {assignee:'m3', hours:6, deps:[ev, cl, win], ms:M2.id});
  const xg  = t('事前相談(斜線・採光)', {kind:'mtg', party:PG.id, due:addDays(30), hours:2, assignee:'m1', ms:M2.id});
  const C = (name, items) => ({id: uid(), name, items});
  const D = (no, name, scale, contents) => ({id: uid(), no, name, scale, contents});
  const dA101 = D('A-101', '平面図', '1/100', [C('1F平面図', [xe, r1, ps, st, f1, xk, fur]), C('2F平面図', [r1, ps, f2])]);
  const dA201 = D('A-201', '立面図', '1/100', [C('東・西立面図', [el, win, xg]), C('南・北立面図', [el, win])]);
  const dA301 = D('A-301', '断面図', '1/100', [C('A-A断面図', [r1, mt, cl, sec])]);
  const dA401 = D('A-401', '矩計図', '1/30', [C('矩計図(南側)', [cl, win, kn])]);
  const dA501 = D('A-501', '部分詳細図', '1/10', [C('軒先詳細', [xs, ev])]);
  p.drawings = [dA101, dA201, dA301, dA401, dA501];
  p.links = [
    {id: uid(), from: dA501.id, to: dA401.id, memo: '軒先納まりの検討が終わったら矩計図に反映'},
    {id: uid(), from: dA101.id, to: dA301.id, memo: 'PS位置確定後、断面に反映'},
  ];
  p.cap = { m1: 10, m2: 6, m3: 5 };   // 他案件と兼務している想定
  return p;
}
function seed(){
  return { v:2, updatedAt: Date.now(), deleted:[], projects:[seedProject()], members:[
    {id:'m1', name:'高橋', color:COLORS[0]}, {id:'m2', name:'佐藤', color:COLORS[1]}, {id:'m3', name:'鈴木', color:COLORS[2]} ] };
}
function normalize(s){
  s.members = s.members || []; s.projects = s.projects || []; s.deleted = s.deleted || [];
  s.projects.forEach(p => {
    p.drawings = p.drawings || []; p.tasks = p.tasks || {}; p.links = p.links || [];
    p.milestones = p.milestones || []; p.parties = p.parties || []; p.cap = p.cap || {}; p.hpd = +p.hpd || 8;
    p.pdf = Object.assign(defaultPdf(), p.pdf || {}); p.pdf.m = Object.assign({t:15,r:15,b:15,l:20}, p.pdf.m); p.pdf.inc = Object.assign(defaultPdf().inc, p.pdf.inc);
    p.progressMode = p.progressMode || 'count';
    if (p.autoSort == null) p.autoSort = true;
    Object.values(p.tasks).forEach(t => {
      t.deps = (t.deps || []).filter(d => p.tasks[d] && d !== t.id);
      t.kind = t.kind || 'in'; t.memo = t.memo || ''; t.ms = t.ms || ''; t.home = t.home || ''; t.party = t.party || '';
      t.st = t.st || 'req'; t.due = t.due || ''; t.days = +t.days || 0; t.hours = +t.hours || 0;
      if (t.ms && !p.milestones.some(m => m.id === t.ms)) t.ms = '';
    });
    p.drawings.forEach(d => { d.contents = d.contents || []; d.contents.forEach(c => c.items = [...new Set((c.items || []).filter(i => p.tasks[i]))]); });
  });
  return s;
}

let S;
try { S = JSON.parse(lsGet(LS_KEY)); } catch(e) { S = null; }
if (!S || !S.projects) S = seed();
normalize(S);
if (!S.projects.length) S.projects.push(newProject());
let ui = Object.assign({ fadeInst:false, openOnly:true, showLinks:true, zoom:0.8, treeWide:false, openD:[], memDone:false, memOpen:{} }, (() => { try { return JSON.parse(lsGet(UI_KEY) || '{}'); } catch(e) { return {}; } })());
const saveUi = () => lsSet(UI_KEY, JSON.stringify(ui));

const qs = new URLSearchParams(location.search);
let cur = { pid: S.projects[0].id, view: 'list', did: null };
{ const want = qs.get('p') || lsGet('zumentask.lastpid'); if (want && S.projects.some(p => p.id === want)) cur.pid = want; }
let treeScope = 'sel', linking = null;
const memoOpen = new Set();

const P = () => S.projects.find(p => p.id === cur.pid) || S.projects[0];
const member = id => S.members.find(m => m.id === id);
const party = (p, id) => p.parties.find(x => x.id === id);

/* ---------------- commit / undo ---------------- */
let snap = JSON.stringify(S), undoStack = [], ver = 0;
function persist(){ snap = JSON.stringify(S); lsSet(LS_KEY, snap); ver++; }
function commit(){
  const p = P(); if (p) p.updatedAt = Date.now();
  S.updatedAt = Date.now();
  undoStack.push(snap); if (undoStack.length > 100) undoStack.shift();
  persist(); dirty = true; scheduleSync(); render();
}
function undo(){
  if (!undoStack.length) return toast('これ以上戻せません');
  S = normalize(JSON.parse(undoStack.pop()));
  if (!S.projects.some(p => p.id === cur.pid)) cur.pid = S.projects[0].id;
  const p = P(); if (p) p.updatedAt = Date.now(); S.updatedAt = Date.now();
  persist(); dirty = true; scheduleSync(); render(); toast('元に戻しました');
}

/* ---------------- model helpers ---------------- */
const dTaskIds = d => { const s = new Set(); d.contents.forEach(c => c.items.forEach(i => s.add(i))); return [...s]; };
function places(p, tid){ const r = []; p.drawings.forEach(d => d.contents.forEach(c => { if (c.items.includes(tid)) r.push({d, c}); })); return r; }
const placeCount = (p, tid) => places(p, tid).length;
function homePlace(p, tid){ const pl = places(p, tid); return pl.find(x => x.c.id === p.tasks[tid].home) || pl[0]; }
function progressOf(p, ids){
  ids = ids.filter(i => p.tasks[i]); if (!ids.length) return null;
  if (p.progressMode === 'hours'){
    let tot = 0, dn = 0; ids.forEach(i => { const h = +p.tasks[i].hours || 0; tot += h; if (p.tasks[i].done) dn += h; });
    if (!tot) return null; return Math.round(dn / tot * 100);
  }
  return Math.round(ids.filter(i => p.tasks[i].done).length / ids.length * 100);
}
const dProgress = (p, d) => progressOf(p, dTaskIds(d));
function placedIds(p){ const s = new Set(); p.drawings.forEach(d => dTaskIds(d).forEach(i => s.add(i))); return [...s]; }
const projProgress = p => progressOf(p, placedIds(p));
function dependsOn(p, a, b, seen = new Set()){
  if (a === b) return true; if (seen.has(a)) return false; seen.add(a);
  return (p.tasks[a]?.deps || []).some(d => dependsOn(p, d, b, seen));
}
const wouldCycle = (p, tid, dep) => dep === tid || dependsOn(p, dep, tid);
function deleteTask(p, tid){
  delete p.tasks[tid];
  p.drawings.forEach(d => d.contents.forEach(c => c.items = c.items.filter(i => i !== tid)));
  Object.values(p.tasks).forEach(t => t.deps = t.deps.filter(x => x !== tid));
}
function gcTasks(p){ const used = new Set(placedIds(p)); Object.keys(p.tasks).forEach(id => { if (!used.has(id)) deleteTask(p, id); }); }
function findDC(p, did, cid){ const d = p.drawings.find(x => x.id === did); return { d, c: d && d.contents.find(x => x.id === cid) }; }
function nextNo(p){
  const last = p.drawings[p.drawings.length - 1]; if (!last) return 'A-001';
  const m = String(last.no).match(/^(.*?)(\d+)(\D*)$/);

  return m[1] + String(+m[2] + 1).padStart(m[2].length, '0') + m[3];
}
const newTask = o => Object.assign({ id: uid(), title: '', kind:'in', assignee: '', hours: 0, deps: [], done: false, memo: '', ms:'', home:'', party:'', st:'req', due:'', days:0 }, o);
const capOf = (p, mid) => p.cap[mid] != null ? +p.cap[mid] : 30;

/* ---------------- milestones: effective band ---------------- */
// 各作業の「帯」= 自分に付けた締切と、後続作業の帯のうち早い方(後続から自動継承)
const msSorted = p => [...p.milestones].sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
function effBandsRaw(p){
  const ms = msSorted(p), M = ms.length, idx = {}; ms.forEach((m, i) => idx[m.id] = i);
  const succ = {}; Object.values(p.tasks).forEach(t => t.deps.forEach(d => (succ[d] = succ[d] || []).push(t.id)));
  const band = {}, vis = {};
  const B = id => {
    if (band[id] != null) return band[id]; if (vis[id]) return M; vis[id] = 1;
    const t = p.tasks[id]; let b = t.ms && idx[t.ms] != null ? idx[t.ms] : M;
    (succ[id] || []).forEach(s => b = Math.min(b, B(s)));
    return band[id] = b;
  };
  Object.keys(p.tasks).forEach(B);
  return { band, ms, M, succ, idx };
}
let EC = { key: null, val: null };
function eff(p){ const k = ver + '|' + p.id; if (EC.key !== k) EC = { key: k, val: effBandsRaw(p) }; return EC.val; }
const bandColor = (E, b) => b < E.M ? (E.ms[b].color || COLORS[b % COLORS.length]) : NOBAND;
const bandName = (E, b) => b < E.M ? E.ms[b].name : '未定';

function moveToBand(p, tid, j){
  const E = effBandsRaw(p), t = p.tasks[tid], cur0 = E.band[tid];
  const setMs = (task, k) => task.ms = k >= E.M ? '' : E.ms[k].id;
  if (j === cur0) return;
  setMs(t, j);
  if (j > cur0) { // 後ろへ:後続作業も連れて行く
    const stack = [...(E.succ[tid] || [])], seen = new Set();
    while (stack.length) {
      const s = stack.pop(); if (seen.has(s)) continue; seen.add(s);
      const st = p.tasks[s], own = st.ms && E.idx[st.ms] != null ? E.idx[st.ms] : E.M;
      if (own < j) setMs(st, j);
      (E.succ[s] || []).forEach(x => stack.push(x));
    }
  } // 前へ:前提作業は帯の継承で自動的についてくる
}
function applyMoves(p, list){
  const before = effBandsRaw(p).band;
  list.forEach(([tid, j]) => moveToBand(p, tid, j));
  const after = effBandsRaw(p).band, prim = new Set(list.map(x => x[0]));
  return Object.keys(after).filter(id => before[id] !== after[id] && !prim.has(id));
}
function simulateMoves(p, list){
  const tmp = Object.assign({}, p, { tasks: JSON.parse(JSON.stringify(p.tasks)) });
  return applyMoves(tmp, list);
}

/* ---------------- review ---------------- */
function review(p, k){
  const E = eff(p), ms = E.ms[k], T = p.tasks;
  const ids = placedIds(p).filter(i => E.band[i] <= k), set = new Set(ids);
  const pct = progressOf(p, ids), D = workdays(ms.date), cal = calDays(ms.date);
  const remH = ids.filter(i => T[i].kind !== 'ext' && !T[i].done).reduce((a, i) => a + (+T[i].hours || 0), 0);
  const per = {}; ids.forEach(i => { const t = T[i]; if (t.kind === 'ext' || t.done || !t.hours) return; const a = t.assignee || ''; per[a] = (per[a] || 0) + (+t.hours || 0); });
  const rows = Object.keys(per).map(a => {
    const m = member(a), cap = a ? capOf(p, a) / 5 * (D || 0) : 0;
    return { m, rem: per[a], cap, ratio: cap ? per[a] / cap : Infinity };
  }).sort((a, b) => b.ratio - a.ratio);
  // 日程(営業日):社内作業=時間÷(その人の1日あたり稼働)、外部/打合せ=日付で固定 or 所要日数
  const F = {}, vis = {};
  const fin = id => {
    if (F[id] != null) return F[id]; if (vis[id]) return 0; vis[id] = 1;
    const t = T[id]; let base = 0; t.deps.forEach(d => { if (set.has(d)) base = Math.max(base, fin(d)); });
    if (t.done) return F[id] = base;
    if (t.kind === 'in') { const perDay = t.assignee ? (capOf(p, t.assignee) / 5 || p.hpd) : p.hpd; return F[id] = base + (+t.hours || 0) / perDay; }
    if (t.due) return F[id] = Math.max(base, Math.max(0, workdays(t.due) || 0));
    return F[id] = base + (+t.days || 0);
  };
  let cpDays = 0; ids.forEach(i => cpDays = Math.max(cpDays, fin(i)));
  const ext = ids.filter(i => T[i].kind !== 'in' && !T[i].done);
  const overdue = ext.filter(i => isOverdue(T[i])), nodue = ext.filter(i => !T[i].due && !T[i].days);
  const worst = rows[0];
  let status = 'ok', reasons = [];
  if (pct === 100) status = 'done';
  else if (cal != null && cal < 0) { status = 'over'; reasons.push('締切超過'); }
  else {
    rows.forEach(r => { if (!r.m) return; if (r.ratio > 1) reasons.push(`${r.m.name} ${Math.round(r.ratio * 100)}%`); });
    if (D != null && cpDays > D) reasons.push(`日程 ${cpDays.toFixed(1)}/${D}日`);
    if (reasons.length) status = 'over';
    else {
      if (rows.some(r => r.m && r.ratio > .85)) reasons.push(`${worst.m.name} ${Math.round(worst.ratio * 100)}%`);
      if (D != null && cpDays > D * .85) reasons.push('日程に余裕なし');
      if (overdue.length) reasons.push(`回答遅れ${overdue.length}件`);
      if (rows.some(r => !r.m)) reasons.push('担当未定あり');
      if (reasons.length) status = 'warn';
    }
  }
  return { ms, k, ids, pct, D, cal, remH, rows, cpDays, ext, overdue, nodue, status, reasons };
}
const JUDGE = { ok:'余裕あり', warn:'要注意', over:'厳しい', done:'完了' };

/* ---------------- segmented progress bar ---------------- */
function segBar(p, ids){
  const E = eff(p), T = p.tasks; ids = ids.filter(i => T[i]);
  const hm = p.progressMode === 'hours';
  const segs = [];
  for (let b = 0; b <= E.M; b++) {
    const l = ids.filter(i => E.band[i] === b); if (!l.length) continue;
    const n = hm ? l.reduce((a, i) => a + (+T[i].hours || 0), 0) : l.length;
    const dn = hm ? l.filter(i => T[i].done).reduce((a, i) => a + (+T[i].hours || 0), 0) : l.filter(i => T[i].done).length;
    const rem = l.filter(i => !T[i].done && T[i].kind !== 'ext').reduce((a, i) => a + (+T[i].hours || 0), 0);
    if (hm && !n) continue;
    const pc = n ? Math.round(dn / n * 100) : 0;
    segs.push(`<span style="flex:${n};--c:${E.M ? bandColor(E, b) : 'var(--ink)'}" title="${esc(bandName(E, b))}:${l.filter(i => T[i].done).length}/${l.length}件 ${pc}% ・残り${fmtH(rem)}h"><i style="width:${pc}%"></i></span>`);
  }
  const pr = progressOf(p, ids);
  return `<div class="sbar">${segs.join('') || '<span style="flex:1;--c:var(--line)"></span>'}</div><span class="pct ${pr == null ? 'muted' : ''}">${pr == null ? '—' : pr + '%'}</span>`;
}

function laneLinks(p){
  const idx = {}; p.drawings.forEach((d, i) => idx[d.id] = i);
  const L = p.links.filter(l => idx[l.from] != null && idx[l.to] != null).map(l => {
    const a = idx[l.from], b = idx[l.to]; return { l, a, b, lo: Math.min(a, b), hi: Math.max(a, b) };
  }).sort((x, y) => (x.hi - x.lo) - (y.hi - y.lo));
  const lanes = [];
  L.forEach(o => { let k = 0; while (lanes[k] && lanes[k].some(([lo, hi]) => !(o.hi <= lo || o.lo >= hi))) k++; (lanes[k] = lanes[k] || []).push([o.lo, o.hi]); o.lane = k; });
  return { L, nl: lanes.length };
}
function linkSVG(p){
  const { L, nl } = laneLinks(p);
  const RL = rowLayout(p), yc = i => RL.c[i], LX = 34 + nl * 30 + 4;
  L.forEach(o => o.my = (yc(o.a) + yc(o.b)) / 2);
  [...L].sort((a, b) => a.my - b.my).reduce((last, o) => { o.ly = Math.max(o.my, last + 23); return o.ly; }, -1e9);
  const H = Math.max(RL.H, ...L.map(o => o.ly + 12)), W = LX + 230;
  const paths = L.map(o => {
    const x = 34 + o.lane * 30, y1 = yc(o.a), y2 = yc(o.b), s = y2 > y1 ? 1 : -1, r = 8;
    const d = `M7,${y1} H${x - r} Q${x},${y1} ${x},${y1 + s * r} V${y2 - s * r} Q${x},${y2} ${x - r},${y2} H11`;
    const memo = trunc(o.l.memo || '(メモなし)', 18), tw = Math.min(220, memo.length * 11.5 + 14);
    return `<g data-lid="${o.l.id}" data-from="${o.l.from}" data-to="${o.l.to}">
      <path class="lk" d="${d}" fill="none" stroke="#5c5a55" stroke-width="1.5" marker-end="url(#ah)"/>
      <path class="lk" d="${d}" fill="none" stroke="transparent" stroke-width="10" data-act="link"/>
      <path d="M${x},${o.my} L${x + 6},${o.my} L${LX - 4},${o.ly}" fill="none" stroke="#d2462b" stroke-width=".8" stroke-dasharray="2 2"/>
      <g class="lbl" data-act="link"><rect x="${LX}" y="${o.ly - 10}" width="${tw}" height="20" rx="3" fill="#fff" stroke="#d2462b" stroke-width=".8"/>
      <text x="${LX + 7}" y="${o.ly + 4}" font-size="11" fill="#d2462b">${esc(memo)}</text><title>${esc(o.l.memo || '')}</title></g></g>`;
  }).join('');
  return `<svg class="linksvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c5a55"/></marker></defs>${paths}</svg>`;
}

function memberLoads(p){
  const E = eff(p), T = p.tasks, M = E.M;
  const ids = placedIds(p).filter(i => T[i].kind !== 'ext');
  const wd = E.ms.map(m => workdays(m.date) ?? 0);
  const people = [...S.members.map(m => ({ id: m.id, m })), { id: '', m: null }];
  return people.map(r => {
    const mine = ids.filter(i => (T[i].assignee || '') === r.id);
    const rem = mine.filter(i => !T[i].done);
    const perDay = r.m ? capOf(p, r.id) / 5 : 0;
    let cum = 0;
    const bands = [];
    for (let k = 0; k <= M; k++) {
      const h = rem.filter(i => E.band[i] === k).reduce((a, i) => a + (+T[i].hours || 0), 0);
      cum += h;
      if (k < M) {
        const cap = perDay * wd[k], icap = perDay * (wd[k] - (k ? wd[k - 1] : 0));
        bands.push({ k, h, cum, cap, icap, ratio: cap ? cum / cap : (cum ? Infinity : 0), past: calDays(E.ms[k].date) < 0 });
      } else bands.push({ k, h, cum, cap: null, ratio: null });
    }
    const remH = rem.reduce((a, i) => a + (+T[i].hours || 0), 0), doneH = mine.filter(i => T[i].done).reduce((a, i) => a + (+T[i].hours || 0), 0);
    const worst = bands.filter(b => b.ratio != null && b.cum > 0).reduce((w, b) => (!w || b.ratio > w.ratio) ? b : w, null);
    return { ...r, mine, rem, remH, doneH, bands, worst, perDay };
  }).filter(r => r.m || r.mine.length);
}

}

function printLinks(p, gw, rowH, headH){
  const { L, nl } = laneLinks(p);
  const H = headH + p.drawings.length * rowH, yc = i => headH + i * rowH + rowH / 2;
  let s = `<svg style="position:absolute;left:100%;top:0;overflow:visible" width="${gw}mm" height="${H}mm" viewBox="0 0 ${gw} ${H}">
    <defs><marker id="pah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>`;
  const LX = 5 + nl * 5 + 2;
  L.forEach(o => o.my = (yc(o.a) + yc(o.b)) / 2);
  [...L].sort((a, b) => a.my - b.my).reduce((last, o) => { o.ly = Math.max(o.my, last + 3.6); return o.ly; }, -1e9);
  const maxCh = Math.max(6, Math.floor((gw - LX) / 2.7));
  L.forEach(o => {
    const x = 5 + o.lane * 5, y1 = yc(o.a), y2 = yc(o.b), sg = y2 > y1 ? 1 : -1, r = 1.5;
    s += `<path d="M0.5,${y1} H${x - r} Q${x},${y1} ${x},${y1 + sg * r} V${y2 - sg * r} Q${x},${y2} ${x - r},${y2} H1.5" fill="none" stroke="#333" stroke-width=".3" marker-end="url(#pah)"/>`;
    s += `<path d="M${x},${o.my} L${LX - .8},${o.ly - .9}" stroke="#c0392b" stroke-width=".15" stroke-dasharray=".6 .6" fill="none"/>`;
    s += `<text x="${LX}" y="${o.ly}" font-size="2.6" fill="#c0392b">${esc(trunc(o.l.memo, maxCh))}</text>`;
  });
  return s + '</svg>';
}

/* チーム配布:接続情報をパスコードで暗号化 (PBKDF2 + AES-GCM) */
const b64e = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function passKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptCfg(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await passKey(pass, salt), new TextEncoder().encode(JSON.stringify(obj)));
  return [b64e(salt), b64e(iv), b64e(ct)].join('.');
}
async function decryptCfg(str, pass){
  const [s, i, c] = str.split('.').map(b64d);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: i }, await passKey(pass, s), c);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function getTok(){
  if (cfg.refresh && cfg.appKey) {
    if (access.tok && Date.now() < access.exp - 60000) return access.tok;
    const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: cfg.refresh, client_id: cfg.appKey }) });
    if (!r.ok) throw new Error('認証失敗');

  }

}
async function dbxDownload(){
  const tok = await getTok();
  const r = await fetch('https://content.dropboxapi.com/2/files/download', { method: 'POST', headers: { Authorization: 'Bearer ' + tok, 'Dropbox-API-Arg': dbxArg({ path: cfg.path }) } });
  if (r.status === 409) return null;
  if (r.status === 401) throw new Error('認証切れ');
  if (!r.ok) throw new Error('取得 ' + r.status);

}
async function dbxUpload(){

  const r = await fetch('https://content.dropboxapi.com/2/files/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/octet-stream', 'Dropbox-API-Arg': dbxArg({ path: cfg.path, mode, autorename: false, mute: true }) }, body: JSON.stringify(S) });

}
function mergeRemote(remote){
  remote = normalize(remote);
  if (!dirty) { S = remote; return; }
  const del = new Set([...(S.deleted || []), ...(remote.deleted || [])]);
  const map = {};
  remote.projects.forEach(p => map[p.id] = p);
  S.projects.forEach(p => { const r = map[p.id]; if (!r || (p.updatedAt || 0) >= (r.updatedAt || 0)) map[p.id] = p; });
  const order = [...S.projects.map(p => p.id), ...remote.projects.map(p => p.id)].filter((id, i, a) => a.indexOf(id) === i);
  const mem = {}; remote.members.forEach(m => mem[m.id] = m); S.members.forEach(m => mem[m.id] = m);
  S = { v: 2, updatedAt: Date.now(), members: Object.values(mem), projects: order.map(id => map[id]).filter(p => p && !del.has(p.id)), deleted: [...del] };

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function dbxConnect(){
  if (!crypto.subtle) return toast('https(GitHub Pages等)で開いてください');
  const verf = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verf)));
  lsSet('zumentask.pkce', JSON.stringify({ ver: verf, pid: cur.pid }));
  const redirect = location.origin + location.pathname;
  location.href = `https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(cfg.appKey)}&response_type=code&code_challenge=${ch}&code_challenge_method=S256&token_access_type=offline&redirect_uri=${encodeURIComponent(redirect)}`;
}
async function handleOAuth(){
  const code = qs.get('code'); if (!code) return;
  let pk = null; try { pk = JSON.parse(lsGet('zumentask.pkce')); } catch(e) {}
  history.replaceState(null, '', location.pathname + (pk?.pid ? '?p=' + pk.pid : ''));
  if (!pk) return;
  if (pk.pid && S.projects.some(p => p.id === pk.pid)) cur.pid = pk.pid;
  try {
    const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ code, grant_type: 'authorization_code', code_verifier: pk.ver, client_id: cfg.appKey, redirect_uri: location.origin + location.pathname }) });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json(); cfg.refresh = j.refresh_token; cfg.token = ''; access = { tok: j.access_token, exp: Date.now() + j.expires_in * 1000 }; saveCfg();
    lsSet('zumentask.pkce', ''); rev = null; dirty = true;
    toast('Dropboxと連携しました'); sync(true);
  } catch(e) { toast('Dropbox連携に失敗しました'); }
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  if (!e.target.closest('.menu')) closeMenu();
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, p = P();
  const row = a.closest('[data-did]'), did = row ? row.dataset.did : a.dataset.did;
  const tidOf = () => a.closest('[data-tid]').dataset.tid;
  switch (act) {
    case 'members': return openMembers();
    case 'milestones': return openMilestones();
    case 'parties': return openParties();
    case 'pdf': return openPdf();
    case 'ppdf': return doPrint('parties');
    case 'settings': return openSettings();
    case 'review': return openReview(+a.dataset.k);
    case 'pmode': p.progressMode = a.dataset.v; return commit();
    case 'tog': { const id = did; ui.openD = isOpenD(id) ? ui.openD.filter(x => x !== id) : [...ui.openD, id]; saveUi(); return render(); }
    case 'openall': ui.openD = p.drawings.map(d => d.id); saveUi(); return render();
    case 'closeall': ui.openD = []; saveUi(); return render();
    case 'opencontent': { const r = a.closest('.crow'); cur.view = 'detail'; cur.did = r.dataset.did; scrollToCid = r.dataset.cid; linking = null; return render(); }
    case 'memdone': ui.memDone = a.checked; saveUi(); return render();
    case 'mjump': { const el = $('#mcard-' + (a.dataset.mid || '_')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    case 'jump': { const tid = tidOf(), hp = homePlace(p, tid); if (!hp) return; cur.view = 'detail'; cur.did = hp.d.id; scrollToDid = hp.d.id; render(); return setTimeout(() => jumpToTask(tid), 60); }
    case 'autosort': p.autoSort = a.checked; if (a.checked) sortDrawings(p); return commit();
    case 'showlinks': ui.showLinks = a.checked; saveUi(); return render();
    case 'fade': ui.fadeInst = a.checked; saveUi(); return render();
    case 'openonly': ui.openOnly = a.checked; saveUi(); return render();
    case 'addd': return addDrawing();
    case 'deld': return deleteDrawing(did);
    case 'open': cur.view = 'detail'; cur.did = did; scrollToDid = did; linking = null; return render();
    case 'port':
      if (!linking) { linking = did; return render(); }
      if (linking === did) { linking = null; return render(); }
      { const from = linking; linking = null; hideBanner(); return createLink(from, did); }
    case 'link': return editLink(a.closest('[data-lid]').dataset.lid);
    case 'goto': e.preventDefault(); if (cur.view !== 'detail') { cur.view = 'detail'; cur.did = a.dataset.did; scrollToDid = a.dataset.did; return render(); } return setActiveDrawing(a.dataset.did, true);
    case 'zoom': {
      const v = a.dataset.v; if (v === '+') ui.zoom = Math.min(1.6, ui.zoom + .1); else if (v === '-') ui.zoom = Math.max(.3, ui.zoom - .1);
      else if (lastT) ui.zoom = Math.max(.3, Math.min(1, ($('#treebox').clientWidth - 10) / lastT.W));
      ui.zoom = Math.round(ui.zoom * 100) / 100; saveUi(); $('#zl').textContent = Math.round(ui.zoom * 100) + '%'; return renderTree();
    }
    case 'wide': ui.treeWide = !ui.treeWide; saveUi(); return render();
    case 'tscope': treeScope = a.dataset.v; $$('[data-act=tscope]').forEach(b => b.classList.toggle('on', b === a)); return renderTree();
    case 'chain': { const li = a.closest('.task'); return toggleChain(li.dataset.did, li.dataset.cid, +li.dataset.i); }
    case 'more': return taskMenu(a);
    case 'edit': return editTask(tidOf());
    case 'place': return placeTask(tidOf(), a.closest('[data-cid]')?.dataset.cid);
    case 'memo': { const li = a.closest('.task'); const key = li.dataset.tid + li.dataset.cid; if (memoOpen.has(key)) memoOpen.delete(key); else { memoOpen.add(key); focusMemo = key; } return render(); }
    case 'st': { const t = p.tasks[tidOf()]; if (t.done) { t.done = false; t.st = 'wait'; } else if (t.st === 'req') t.st = 'wait'; else { t.done = true; } return commit(); }
    case 'insert': { const c = a.closest('.content'); return insertExisting(c.dataset.did, c.dataset.cid); }
    case 'cmore': return contentMenu(a);
    case 'dmore': return drawingMenu(a, did);
    case 'addc': { const d = p.drawings.find(x => x.id === did); const c = { id: uid(), name: '作図内容', items: [] }; d.contents.push(c); focusAfter = c.id; return commit(); }
  }
});
document.addEventListener('change', e => {
  const el = e.target, p = P();
  if (el.id === 'projSel') {
    if (el.value === '__new') { el.value = cur.pid; return prompt2('新規プロジェクト', 'プロジェクト名', '', nm => { const np = newProject(nm || '新規プロジェクト'); S.projects.push(np); cur.pid = np.id; cur.did = null; commit(); }); }
    cur.pid = el.value; cur.did = null; lsSet('zumentask.lastpid', cur.pid); history.replaceState(null, '', '?p=' + cur.pid); return render();
  }
  if (!$('#app').contains(el)) return;
  if (el.dataset.f) {
    const d = p.drawings.find(x => x.id === el.closest('[data-did]').dataset.did); d[el.dataset.f] = el.value.trim();
    if (el.dataset.f === 'no' && sortDrawings(p)) { flashDid = d.id; toast(`${d.no} を番号順の位置へ移動しました`); }
    return commit();
  }
  if (el.dataset.cap) { p.cap[el.dataset.cap] = Math.max(0, parseFloat(el.value) || 0); return commit(); }
  if (el.dataset.cf) { const box = el.closest('.content'); const { c } = findDC(p, box.dataset.did, box.dataset.cid); c.name = el.value.trim() || c.name; return commit(); }
  if (el.dataset.tf) {
    const host = el.closest('[data-tid]'), t = p.tasks[host.dataset.tid], f = el.dataset.tf;
    if (f === 'party' && el.value === '__new') { el.value = t.party; return openParties(); }
    if (f === 'memo' && host.dataset.cid) memoOpen.delete(host.dataset.tid + host.dataset.cid);
    t[f] = f === 'hours' ? (parseFloat(el.value) || 0) : f === 'title' ? (el.value.trim() || t.title) : el.value;
    if (f === 'due' && t.kind === 'ext' && el.value && t.st === 'req') t.st = 'wait';
    return commit();
  }
  if (el.dataset.act === 'done') { const t = p.tasks[el.closest('[data-tid]').dataset.tid]; t.done = el.checked; return commit(); }
});
document.addEventListener('focusout', e => { // 備考エディタ:変更なしで離れたら閉じる
  const el = e.target; if (!el.matches || !el.matches('.tmemo textarea')) return;
  const li = el.closest('.task'); const key = li.dataset.tid + li.dataset.cid;
  setTimeout(() => { if (memoOpen.has(key) && P().tasks[li.dataset.tid].memo === el.value) { memoOpen.delete(key); render(); } }, 120);
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && !e.isComposing && el.matches('.addtask input')) { e.preventDefault(); return addTask(el.dataset.did, el.dataset.cid, el.value.trim()); }
  if (e.key === 'Enter' && !e.isComposing && el.matches('.cell, .ttl, .hrs, .pmemo')) { el.blur(); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && el.matches('.tmemo textarea')) { el.blur(); return; }
  if (e.key === 'Escape') { if ($('.mbg')) return closeModal(); closeMenu(); if (linking) { linking = null; hideBanner(); render(); } return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey && !/INPUT|TEXTAREA|SELECT/.test(el.tagName)) { e.preventDefault(); undo(); }
});
$$('.tabs button').forEach(b => b.onclick = () => { cur.view = b.dataset.view; linking = null; hideBanner(); render(); });
$('#sync').onclick = openSettings;

let dragIdx = null;
document.addEventListener('mousedown', e => { const g = e.target.closest && e.target.closest('.grip'); if (g) g.closest('.drow').draggable = true; });
document.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('.drow'); if (!r) return; dragIdx = +r.dataset.idx; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', ''); } catch(_) {} });
document.addEventListener('dragover', e => { const r = e.target.closest && e.target.closest('.drow:not(.head)'); if (dragIdx == null || !r) return; e.preventDefault(); $$('.drow.dragover').forEach(x => x.classList.remove('dragover')); r.classList.add('dragover'); });
document.addEventListener('drop', e => { const r = e.target.closest && e.target.closest('.drow:not(.head)'); if (dragIdx == null || !r) return; e.preventDefault(); const p = P(), to = +r.dataset.idx; const [d] = p.drawings.splice(dragIdx, 1); p.drawings.splice(to, 0, d); dragIdx = null; commit(); });
document.addEventListener('dragend', () => { dragIdx = null; $$('.drow').forEach(x => { x.draggable = false; x.classList.remove('dragover'); }); });
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

/* ---------------- boot ---------------- */
lsSet('zumentask.lastpid', cur.pid);
render(); setStatus();
handleOAuth().then(() => {
  if (syncEnabled() && !qs.get('code')) sync();
  else if (!syncEnabled() && EMBED_ENC && !lsGet('zumentask.localonly')) openUnlock();
});
</script>
</body>
